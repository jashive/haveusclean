name: PR Acceptance

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]

jobs:
  acceptance:
    permissions:
      contents: read
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run tests
        run: npm test

      - name: Run Growth G2 controlled-outreach tests
        run: node --test tests/growthG2OutreachEligibility.test.mjs tests/growthG2ProviderDryRun.test.mjs

      - name: Run Growth G3 reply-qualification tests
        run: node --test tests/growthG3ReplyClassification.test.mjs

      - name: Run Growth G4 handoff-preflight tests
        run: node --test tests/growthG4ServiceOSHandoffPreflight.test.mjs

      - name: Build
        run: npm run build
