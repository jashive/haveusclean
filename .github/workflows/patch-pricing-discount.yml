name: One-shot pricing discount normalization patch

on:
  push:
    branches:
      - fix/pricing-snapshot-discount-normalization
    paths:
      - .github/workflows/patch-pricing-discount.yml

permissions:
  contents: write

jobs:
  patch-test-commit:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/pricing-snapshot-discount-normalization
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - name: Apply guarded source patch
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          def replace_once(path, old, new):
              p = Path(path)
              s = p.read_text()
              count = s.count(old)
              if count != 1:
                  raise SystemExit(f'{path}: expected exactly one match, found {count}: {old!r}')
              p.write_text(s.replace(old, new, 1))

          replace_once(
              'src/lib/governedResidentialPricing.js',
              '    discountAmt: toMoney(markedUpSubtotal - discountedSubtotal),',
              '    discountAmt: toMoney(Math.max(0, withDollarAdjustmentsSubtotal - discountedSubtotal)),',
          )

          replace_once(
              'src/features/wave1/ServiceOSQuoteRevisionPanel.jsx',
              "function money(value) { return Math.round((Number(value || 0) + Number.EPSILON) * 100) / 100; }",
              "function money(value) { return Math.round((Number(value || 0) + Number.EPSILON) * 100) / 100; }\nfunction nonNegativeMoney(value) { const n = Number(value); return money(Number.isFinite(n) ? Math.max(0, n) : 0); }\nfunction nonNegativeRate(value) { const n = Number(value); return Number.isFinite(n) ? Math.max(0, n) : 0; }",
          )
          replace_once(
              'src/features/wave1/ServiceOSQuoteRevisionPanel.jsx',
              '    discount_amount: money((Number(quote.discountAmt || 0)) + Number(concessionAmount || 0)),',
              '    discount_amount: nonNegativeMoney(nonNegativeMoney(quote.discountAmt) + nonNegativeMoney(concessionAmount)),',
          )
          replace_once(
              'src/features/wave1/ServiceOSQuoteRevisionPanel.jsx',
              '      discountPct: quote.discPct ?? null,',
              '      discountPct: nonNegativeRate(quote.discPct ?? 0),',
          )
          replace_once(
              'src/features/wave1/ServiceOSQuoteRevisionPanel.jsx',
              '      discountAmount: money((Number(quote.discountAmt || 0)) + Number(concessionAmount || 0)),',
              '      discountAmount: nonNegativeMoney(nonNegativeMoney(quote.discountAmt) + nonNegativeMoney(concessionAmount)),',
          )

          Path('tests/serviceosPricingSnapshotDiscountNormalization.test.mjs').write_text("""import test from 'node:test';
          import assert from 'node:assert/strict';
          import { readFile } from 'node:fs/promises';
          import { computeGovernedResidentialQuote } from '../src/lib/governedResidentialPricing.js';

          const config = {
            id: 'cfg-on-test',
            business_unit_id: 'bu-on',
            jurisdiction_id: 'jur-on',
            configuration_type: 'residential_pricing',
            version: 'ON-TEST',
            configuration: {
              currency_code: 'CAD',
              tax: { rate: 0.13, label: 'HST' },
              minimum_charge: { general_residential: 200 },
              dwelling_matrix: {
                semi_detached_detached: {
                  '4bed_3bath': { package_prices: { complete_deep: 500 } },
                },
              },
              square_footage_adjustments: {
                additional_250_500_sqft: { minimum: 50, maximum: 50 },
              },
              recurring_service: {
                weekly_discount: { min: 0.1, max: 0.1 },
              },
            },
          };

          test('Mississauga-style surcharge is not misclassified as a negative discount', () => {
            const quote = computeGovernedResidentialQuote({
              configurationVersion: config,
              dwellingType: 'detached_house',
              beds: 4,
              baths: 3,
              packageKey: 'complete_deep',
              condition: 'light',
              frequency: 'one_time',
              addons: [],
              approvedSelections: {
                sqftBand: 'additional_250_500_sqft',
                sqftAdjustmentAmount: 50,
              },
            });
            assert.equal(quote.preTaxTotal, 550);
            assert.equal(quote.discountAmt, 0);
            assert.equal(quote.discPct, 0);
          });

          test('recurring discount is calculated from the surcharge-adjusted subtotal', () => {
            const quote = computeGovernedResidentialQuote({
              configurationVersion: config,
              dwellingType: 'detached_house',
              beds: 4,
              baths: 3,
              packageKey: 'complete_deep',
              condition: 'light',
              frequency: 'weekly',
              addons: [],
              approvedSelections: {
                sqftBand: 'additional_250_500_sqft',
                sqftAdjustmentAmount: 50,
                recurringDiscountPct: 0.1,
              },
            });
            assert.equal(quote.preTaxTotal, 495);
            assert.equal(quote.discountAmt, 55);
            assert.equal(quote.discPct, 0.1);
          });

          test('all quote revision pricing paths explicitly normalize discount amount and percentage to non-negative values', async () => {
            const source = await readFile(new URL('../src/features/wave1/ServiceOSQuoteRevisionPanel.jsx', import.meta.url), 'utf8');
            assert.match(source, /function nonNegativeMoney\(value\)/);
            assert.match(source, /function nonNegativeRate\(value\)/);
            assert.match(source, /discount_amount:\s*nonNegativeMoney\(nonNegativeMoney\(quote\.discountAmt\) \+ nonNegativeMoney\(concessionAmount\)\)/);
            assert.match(source, /discountAmount:\s*nonNegativeMoney\(nonNegativeMoney\(quote\.discountAmt\) \+ nonNegativeMoney\(concessionAmount\)\)/);
            assert.match(source, /discountPct:\s*nonNegativeRate\(quote\.discPct \?\? 0\)/);
          });
          """)

          replace_once(
              'package.json',
              'tests/serviceosCanonicalJobDuration.test.mjs tests/serviceosWave4ProductionBoundary.test.mjs',
              'tests/serviceosCanonicalJobDuration.test.mjs tests/serviceosPricingSnapshotDiscountNormalization.test.mjs tests/serviceosWave4ProductionBoundary.test.mjs',
          )
          PY
      - run: npm ci
      - name: Targeted regression
        run: node --test tests/serviceosPricingSnapshotDiscountNormalization.test.mjs tests/serviceosGoal5QuoteRevision.test.mjs tests/serviceosCanonicalJobDuration.test.mjs
      - name: Full regression
        run: npm test
      - name: Production build
        run: npm run build
      - name: Commit tested patch
        shell: bash
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add src/lib/governedResidentialPricing.js src/features/wave1/ServiceOSQuoteRevisionPanel.jsx tests/serviceosPricingSnapshotDiscountNormalization.test.mjs package.json
          git commit -m "Fix revision pricing discount normalization"
          git push origin HEAD:fix/pricing-snapshot-discount-normalization
