name: Apply canonical job duration patch

on:
  push:
    branches:
      - feature/canonical-job-duration
    paths:
      - .github/workflows/canonical-job-duration-apply.yml

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/canonical-job-duration
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Apply patch
        run: python3 scripts/apply-canonical-job-duration.py
      - name: Targeted tests
        run: node --test tests/serviceosCanonicalJobDuration.test.mjs tests/serviceosOfficeQuoteUtils.test.mjs tests/serviceosRevenue.test.mjs tests/serviceosWave3ProductionBoundary.test.mjs
      - name: Full test suite
        run: npm test
      - name: Build
        run: npm run build
      - name: Commit patch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Wave 3: wire canonical job duration into dispatch"
          git push origin HEAD:feature/canonical-job-duration
