name: Goal5 ON AZ Parity Finalize

on:
  push:
    branches:
      - fix/goal5-on-az-operational-parity

permissions:
  contents: write

jobs:
  patch-test:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/goal5-on-az-operational-parity
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Apply parity patch
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          p = Path('src/features/wave1/ServiceOSPartialLeadQuoteContinuation.jsx')
          s = p.read_text()
          s = s.replace('import { promoteExistingLeadForQuote } from "../../lib/serviceosLeadQuoteContinuationClient.js";', 'import { promoteExistingLeadForQuote, saveExistingLeadDetails } from "../../lib/serviceosLeadQuoteContinuationClient.js";')
          old = '    packageKey: normalizePackage(scope.cleanType || scope.packageKey), condition: "light", frequency: normalizeFrequency(scope.frequency), sqftBand: "",\n    preferredDate: text(scope.preferredDate), preferredWindow: text(scope.preferredWindow), notes: text(scope.notes), addons: [],'
          new = '    packageKey: normalizePackage(scope.cleanType || scope.packageKey), condition: text(scope.condition) || "light", frequency: normalizeFrequency(scope.frequency), sqftBand: text(scope.sqftBand),\n    preferredDate: text(scope.preferredDate), preferredWindow: text(scope.preferredWindow), notes: text(scope.notes), addons: Array.isArray(scope.addons) ? scope.addons : [],'
          if old not in s: raise SystemExit('continuation init anchor not found')
          s = s.replace(old, new, 1)
          anchor = '  async function saveDraft() {\n'
          insert = '''  function buildCurrentRequirements() {\n    return {\n      customer: { name: form.customerName.trim() || null, phone: form.phone.trim() || null, email: form.email.trim() || null },\n      location: { address: form.address.trim() || null, city: form.city.trim() || null, postalCode: form.postalCode.trim() || null, jurisdictionId },\n      scope: { dwellingType: form.dwellingType, sqft: form.sqft ? Number(form.sqft) : null, beds: Number(form.beds || 0), baths: form.baths ? Number(form.baths) : null, packageKey: form.packageKey, condition: form.condition, frequency: form.frequency, sqftBand: form.sqftBand || null, addons: [...form.addons], preferredDate: form.preferredDate || null, preferredWindow: form.preferredWindow || null, notes: form.notes.trim() || null },\n    };\n  }\n\n  async function saveLeadDetails() {\n    if (busy || !sr?.id) return;\n    setBusy(true); setError(null); setReview(null);\n    try {\n      const requirements = buildCurrentRequirements();\n      const metadata = { ...(sr.metadata || {}), source: "serviceos_partial_lead_quote_continuation", business_unit_code: businessUnitCode, saved_lead_details: true };\n      await saveExistingLeadDetails({ serviceRequest: sr, requirements, metadata, appUserId, businessUnitId, accessToken });\n      setSaved((current) => ({ ...(current || {}), leadDetailsSaved: true }));\n    } catch (err) { setError(err?.message || "Unable to save lead details."); }\n    finally { setBusy(false); }\n  }\n\n'''
          if anchor not in s: raise SystemExit('saveDraft anchor not found')
          s = s.replace(anchor, insert + anchor, 1)
          old_req = '''      const requirements = {\n        customer: { name: form.customerName.trim() || null, phone: form.phone.trim() || null, email: form.email.trim() || null },\n        location: { address: form.address.trim() || null, city: form.city.trim() || null, postalCode: form.postalCode.trim() || null, jurisdictionId },\n        scope: { dwellingType: form.dwellingType, sqft: form.sqft ? Number(form.sqft) : null, beds: Number(form.beds || 0), baths: Number(form.baths), packageKey: form.packageKey, condition: form.condition, frequency: form.frequency, sqftBand: form.sqftBand || null, addons: form.addons, preferredDate: form.preferredDate || null, preferredWindow: form.preferredWindow || null, notes: form.notes.trim() || null },\n      };'''
          if old_req not in s: raise SystemExit('requirements anchor not found')
          s = s.replace(old_req, '      const requirements = buildCurrentRequirements();', 1)
          old_buttons = '<div style={s.actions}><button type="button" style={s.primary} disabled={busy} onClick={generateQuote}>{busy ? "Working…" : "Generate Governed Quote"}</button><button type="button" style={s.secondary} disabled={busy} onClick={onClose}>Close</button></div>'
          new_buttons = '<div style={s.actions}><button type="button" style={s.secondary} disabled={busy} onClick={saveLeadDetails}>Save Lead Details</button><button type="button" style={s.primary} disabled={busy} onClick={generateQuote}>{busy ? "Working…" : "Generate Governed Quote"}</button><button type="button" style={s.secondary} disabled={busy} onClick={onClose}>Close</button></div>'
          if old_buttons not in s: raise SystemExit('button anchor not found')
          s = s.replace(old_buttons, new_buttons, 1)
          p.write_text(s)

          p = Path('src/lib/serviceosLeadQuoteContinuationClient.js')
          s = p.read_text()
          marker = '\nexport async function promoteExistingLeadForQuote({'
          helper = '''\nexport async function saveExistingLeadDetails({ serviceRequest, requirements, metadata, appUserId, businessUnitId, accessToken }) {\n  assertId(serviceRequest?.id, "Service request");\n  if (serviceRequest.business_unit_id !== businessUnitId) throw new Error("Selected lead does not belong to the active business unit.");\n  if (!["intake", "qualified"].includes(serviceRequest.lifecycle_status)) {\n    throw new Error(`Only intake/qualified leads can save lead details; current status is ${serviceRequest.lifecycle_status || "unknown"}.`);\n  }\n  return patchOne("service_request", serviceRequest.id, {\n    requirements,\n    description: requirements?.scope?.notes || null,\n    metadata: { ...(serviceRequest.metadata || {}), ...(metadata || {}), partial_intake: true },\n    updated_by_app_user_id: appUserId || null,\n  }, accessToken);\n}\n'''
          if marker not in s: raise SystemExit('client export anchor not found')
          s = s.replace(marker, helper + marker, 1)
          p.write_text(s)

          p = Path('src/features/wave1/ServiceOSQuoteRevisionPanel.jsx')
          s = p.read_text()
          old = '''      const quote = {\n        preTaxTotal, taxRate, taxAmount, total: money(preTaxTotal + taxAmount),\n        taxName: config.tax?.label || config.tax?.name || sourcePricing.tax_name, currencyCode,\n        input: { ...sourceScope, scopeMode: 'partial_home', partialAreas: partialAreas.trim(), addons },\n        addonLines: [],\n        teamSize: null,\n        jobHours: null,\n      };'''
          new = '''      const workloadSelections = getDefaultApprovedSelections(configVersion, {\n        condition: sourceScope.condition || 'light',\n        frequency: sourceScope.frequency || 'one_time',\n        sqftBand: sourceScope.sqftBand || '',\n        sqft: sourceScope.sqft ? Number(sourceScope.sqft) : null,\n      });\n      const quote = {\n        preTaxTotal, taxRate, taxAmount, total: money(preTaxTotal + taxAmount),\n        taxName: config.tax?.label || config.tax?.name || sourcePricing.tax_name, currencyCode,\n        input: { ...sourceScope, scopeMode: 'partial_home', partialAreas: partialAreas.trim(), addons },\n        addonLines: [],\n        teamSize: workloadSelections.teamSize ?? null,\n        jobHours: workloadSelections.jobHours ?? null,\n        governance: { laborSource: workloadSelections.laborSource || null },\n      };'''
          if old not in s: raise SystemExit('partial quote anchor not found')
          s = s.replace(old, new, 1)
          p.write_text(s)

          p = Path('src/features/wave3/ServiceOSOperationsWorkspace.jsx')
          s = p.read_text()
          import_anchor = 'import { authenticatedRestFetchWithRefresh, getValidAccessToken } from "../../lib/serviceosAuthClient.js";\n'
          if import_anchor not in s: raise SystemExit('operations import anchor not found')
          s = s.replace(import_anchor, import_anchor + 'import { getJobHours, getTeamSize } from "../../core/pricing/sharedPricing.js";\n', 1)
          old_labor = '''function resolveDurationHours(pricingSnapshot, scope) {\n  const candidates = [\n    pricingSnapshot?.labor_economics?.jobHours,\n    pricingSnapshot?.calculation_outputs?.jobHours,\n    pricingSnapshot?.raw_calculation_snapshot?.jobHours,\n    scope?.estimatedDurationHours,\n    scope?.estimated_duration_hours,\n  ];\n  for (const candidate of candidates) {\n    const value = Number(candidate);\n    if (Number.isFinite(value) && value > 0) return value;\n  }\n  return null;\n}\n\nfunction resolveCrewSize(pricingSnapshot) {\n  const candidates = [\n    pricingSnapshot?.labor_economics?.teamSize,\n    pricingSnapshot?.raw_calculation_snapshot?.teamSize,\n  ];\n  for (const candidate of candidates) {\n    const value = Number(candidate);\n    if (Number.isInteger(value) && value > 0) return value;\n  }\n  return null;\n}'''
          new_labor = '''function exactScopeSqft(scope) {\n  const value = Number(scope?.sqft ?? scope?.squareFeet ?? scope?.square_feet);\n  return Number.isFinite(value) && value > 0 ? value : null;\n}\n\nfunction resolveDurationHours(pricingSnapshot, scope) {\n  const candidates = [\n    pricingSnapshot?.labor_economics?.jobHours,\n    pricingSnapshot?.calculation_outputs?.jobHours,\n    pricingSnapshot?.raw_calculation_snapshot?.jobHours,\n    scope?.estimatedDurationHours,\n    scope?.estimated_duration_hours,\n  ];\n  for (const candidate of candidates) {\n    const value = Number(candidate);\n    if (Number.isFinite(value) && value > 0) return value;\n  }\n  const sqft = exactScopeSqft(scope);\n  return sqft ? getJobHours(sqft) : null;\n}\n\nfunction resolveCrewSize(pricingSnapshot, scope) {\n  const candidates = [\n    pricingSnapshot?.labor_economics?.teamSize,\n    pricingSnapshot?.raw_calculation_snapshot?.teamSize,\n  ];\n  for (const candidate of candidates) {\n    const value = Number(candidate);\n    if (Number.isInteger(value) && value > 0) return value;\n  }\n  const sqft = exactScopeSqft(scope);\n  return sqft ? getTeamSize(sqft) : null;\n}'''
          if old_labor not in s: raise SystemExit('operations labor anchor not found')
          s = s.replace(old_labor, new_labor, 1)
          s = s.replace('  const crewSize = resolveCrewSize(pricingSnapshot);', '  const crewSize = resolveCrewSize(pricingSnapshot, scope);', 1)
          p.write_text(s)

          p = Path('tests/serviceosGoal5PartialLeadQuoteContinuation.test.mjs')
          s = p.read_text()
          s += '''\n\ntest("saved lead details persist add-ons and restore them on reopen without creating a quote", () => {\n  assert.match(continuation, /addons: Array\.isArray\(scope\.addons\) \? scope\.addons : \[\]/);\n  assert.match(continuation, /Save Lead Details/);\n  assert.match(continuation, /saveExistingLeadDetails/);\n  assert.match(continuation, /addons: \[\.\.\.form\.addons\]/);\n  const detailSaver = client.slice(client.indexOf("export async function saveExistingLeadDetails"), client.indexOf("export async function promoteExistingLeadForQuote"));\n  assert.match(detailSaver, /patchOne\("service_request"/);\n  assert.doesNotMatch(detailSaver, /patchOne\("opportunity"|stage:\s*"proposal"|pricing_snapshot/);\n});\n'''
          p.write_text(s)

          p = Path('tests/serviceosGoal5QuoteRevision.test.mjs')
          s = p.read_text()
          s += '''\n\ntest('partial-home revisions preserve PR #73 workload sizing from exact sqft in both markets', () => {\n  assert.match(panel,/const workloadSelections = getDefaultApprovedSelections\(configVersion,[\\s\\S]*sqft: sourceScope\.sqft/);\n  assert.match(panel,/teamSize: workloadSelections\.teamSize \?\? null/);\n  assert.match(panel,/jobHours: workloadSelections\.jobHours \?\? null/);\n  assert.doesNotMatch(panel,/teamSize: null,\\s*jobHours: null/);\n});\n'''
          p.write_text(s)

          p = Path('tests/serviceosCanonicalJobDuration.test.mjs')
          s = p.read_text()
          s += '''\n\ntest("dispatch restores legacy accepted workload from exact saved sqft without rewriting pricing", () => {\n  const operations = fs.readFileSync(new URL("../src/features/wave3/ServiceOSOperationsWorkspace.jsx", import.meta.url), "utf8");\n  assert.match(operations, /function exactScopeSqft\(scope\)/);\n  assert.match(operations, /return sqft \? getJobHours\(sqft\) : null/);\n  assert.match(operations, /return sqft \? getTeamSize\(sqft\) : null/);\n  assert.match(operations, /resolveCrewSize\(pricingSnapshot, scope\)/);\n  const laborResolvers = operations.slice(operations.indexOf("function exactScopeSqft"), operations.indexOf("function pipelineStatusLabel"));\n  assert.doesNotMatch(laborResolvers, /authenticatedRestFetch|PATCH|pricing_snapshot/);\n});\n'''
          p.write_text(s)
          PY
      - name: Install dependencies
        run: npm ci
      - name: Run full regression suite
        run: npm test
      - name: Build production bundle
        run: npm run build
      - name: Commit verified patch
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/features/wave1/ServiceOSPartialLeadQuoteContinuation.jsx src/lib/serviceosLeadQuoteContinuationClient.js src/features/wave1/ServiceOSQuoteRevisionPanel.jsx src/features/wave3/ServiceOSOperationsWorkspace.jsx tests/serviceosGoal5PartialLeadQuoteContinuation.test.mjs tests/serviceosGoal5QuoteRevision.test.mjs tests/serviceosCanonicalJobDuration.test.mjs
          git commit -m "Restore ON AZ workload and saved lead parity"
          git push origin HEAD:fix/goal5-on-az-operational-parity
