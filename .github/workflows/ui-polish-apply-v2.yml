name: Apply dispatch and revenue UI polish v2

on:
  push:
    branches:
      - feature/dispatch-revenue-ui-polish
    paths:
      - .github/workflows/ui-polish-apply-v2.yml

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/dispatch-revenue-ui-polish
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Apply UI polish
        run: |
          python3 - <<'PY'
          from pathlib import Path

          def replace(path, old, new):
              p = Path(path)
              text = p.read_text()
              if old not in text:
                  raise SystemExit(f"anchor not found in {path}: {old[:100]!r}")
              p.write_text(text.replace(old, new, 1))

          ops = "src/features/wave3/ServiceOSOperationsWorkspace.jsx"
          replace(ops,
            '  badge: { display: "inline-flex", width: "fit-content", padding: "4px 8px", borderRadius: 999, background: "#20304A", color: "#BFD4F2", fontSize: 11, fontWeight: 850, textTransform: "uppercase" },\n};',
            '  badge: { display: "inline-flex", width: "fit-content", padding: "4px 8px", borderRadius: 999, background: "#20304A", color: "#BFD4F2", fontSize: 11, fontWeight: 850, textTransform: "uppercase" },\n  badgeReady: { background: "#173A33", color: "#60E7C6" },\n  badgeDispatched: { background: "#1F3358", color: "#AFCBFF" },\n  badgeCompleted: { background: "#3A3120", color: "#FFD78A" },\n  laborMeta: { display: "flex", gap: 6, flexWrap: "wrap", marginTop: 6 },\n  laborBadge: { display: "inline-flex", alignItems: "center", padding: "3px 7px", borderRadius: 999, border: "1px solid #34465F", color: "#B8C7D9", fontSize: 11, fontWeight: 750 },\n  scheduleCard: { marginTop: 12, padding: "10px 12px", borderRadius: 9, border: "1px solid #2D4551", background: "#102329", display: "flex", justifyContent: "space-between", gap: 10, alignItems: "center", flexWrap: "wrap" },\n  autoTag: { marginLeft: 6, padding: "2px 6px", borderRadius: 999, background: "#173A33", color: "#60E7C6", fontSize: 9, fontWeight: 900, letterSpacing: ".04em" },\n};')
          replace(ops,
            'function timezoneForScope(scope, location) {',
            'function resolveCrewSize(pricingSnapshot) {\n  const candidates = [\n    pricingSnapshot?.labor_economics?.teamSize,\n    pricingSnapshot?.raw_calculation_snapshot?.teamSize,\n  ];\n  for (const candidate of candidates) {\n    const value = Number(candidate);\n    if (Number.isInteger(value) && value > 0) return value;\n  }\n  return null;\n}\n\nfunction pipelineStatusLabel(status) {\n  if (status === "ready_to_schedule" || status === "scheduled") return "Ready for Dispatch";\n  if (status === "dispatched" || status === "in_progress") return "Dispatched";\n  if (status === "service_complete" || status === "qa_pending" || status === "corrective_action_required") return "Completed";\n  return String(status || "Unknown").replaceAll("_", " ");\n}\n\nfunction pipelineStatusStyle(status) {\n  if (status === "ready_to_schedule" || status === "scheduled") return styles.badgeReady;\n  if (status === "dispatched" || status === "in_progress") return styles.badgeDispatched;\n  if (status === "service_complete" || status === "qa_pending" || status === "corrective_action_required") return styles.badgeCompleted;\n  return {};\n}\n\nfunction timezoneForScope(scope, location) {')
          replace(ops, '  const durationHours = resolveDurationHours(pricingSnapshot, scope);\n\n  return {', '  const durationHours = resolveDurationHours(pricingSnapshot, scope);\n  const crewSize = resolveCrewSize(pricingSnapshot);\n\n  return {')
          replace(ops, '    estimated_duration_hours: durationHours,\n    suggested_timezone:', '    estimated_duration_hours: durationHours,\n    crew_size: crewSize,\n    suggested_timezone:')
          replace(ops, '  const appUserId = revenueContext?.appUserId ?? null;\n\n  const applyScheduleSuggestion', '  const appUserId = revenueContext?.appUserId ?? null;\n  const selectedHandoff = useMemo(() => handoffs.find((handoff) => handoff.id === handoffId) ?? null, [handoffs, handoffId]);\n\n  const applyScheduleSuggestion')

          old_ready = '''      {handoffs.length ? handoffs.map((handoff) => <div key={handoff.id} style={styles.pipelineRow}>\n        <div>{handoff.dispatch_label}</div>\n        <span style={styles.badge}>ready</span>\n        <button style={styles.secondary} onClick={()=>selectHandoff(handoff.id)}>Select for dispatch</button>\n      </div>) : <div style={styles.note}>No approved handoffs are waiting for dispatch.</div>}'''
          new_ready = '''      {handoffs.length ? handoffs.map((handoff) => <div key={handoff.id} style={styles.pipelineRow}>\n        <div><div>{handoff.dispatch_label}</div><div style={styles.laborMeta}>{handoff.crew_size ? <span style={styles.laborBadge}>Crew {handoff.crew_size}</span> : null}{handoff.estimated_duration_hours ? <span style={styles.laborBadge}>{handoff.estimated_duration_hours}h planned</span> : null}</div></div>\n        <span style={{...styles.badge,...styles.badgeReady}}>Ready for Dispatch</span>\n        <button style={styles.secondary} onClick={()=>selectHandoff(handoff.id)}>Select for dispatch</button>\n      </div>) : <div style={styles.note}>No approved handoffs are waiting for dispatch.</div>}'''
          replace(ops, old_ready, new_ready)
          old_active = '''      {pipelineJobs.length ? pipelineJobs.map((job) => <div key={job.id} style={styles.pipelineRow}>\n        <div>{job.dispatch_label || `Operational job ${handoffIdSnippet(job.id)}`}</div>\n        <span style={styles.badge}>{job.operational_status}</span>\n        <div style={styles.mono}>{job.schedule_window?.scheduled_start ? `${job.schedule_window.scheduled_start} → ${job.schedule_window.scheduled_end || "end pending"}` : "Schedule pending"}</div>\n      </div>) : <div style={styles.note}>No active operational jobs.</div>}'''
          new_active = '''      {pipelineJobs.length ? pipelineJobs.map((job) => <div key={job.id} style={styles.pipelineRow}>\n        <div><div>{job.dispatch_label || `Operational job ${handoffIdSnippet(job.id)}`}</div><div style={styles.laborMeta}>{job.crew_size ? <span style={styles.laborBadge}>Crew {job.crew_size}</span> : null}{job.estimated_duration_hours ? <span style={styles.laborBadge}>{job.estimated_duration_hours}h planned</span> : null}</div></div>\n        <span style={{...styles.badge,...pipelineStatusStyle(job.operational_status)}}>{pipelineStatusLabel(job.operational_status)}</span>\n        <div style={styles.mono}>{job.schedule_window?.scheduled_start ? `${job.schedule_window.scheduled_start} → ${job.schedule_window.scheduled_end || "end pending"}` : "Schedule pending"}</div>\n      </div>) : <div style={styles.note}>No active operational jobs.</div>}'''
          replace(ops, old_active, new_active)
          replace(ops, '<label><span style={styles.label}>End</span><input style={styles.input} type="datetime-local" value={end} onChange={e=>setEnd(e.target.value)} /></label>', '<label><span style={styles.label}>End{selectedHandoff?.estimated_duration_hours ? <span style={styles.autoTag}>AUTO</span> : null}</span><input style={styles.input} type="datetime-local" value={end} onChange={e=>setEnd(e.target.value)} /></label>')
          replace(ops, '    </div>\n    {scheduleHint ? <div style={{...styles.note,marginTop:10}} data-wave3-schedule-prefill-hint="true">{scheduleHint}</div> : null}', '    </div>\n    {selectedHandoff ? <div style={styles.scheduleCard} data-wave3-dispatch-plan="true"><strong>Dispatch plan</strong><div style={styles.laborMeta}>{selectedHandoff.crew_size ? <span style={styles.laborBadge}>Crew {selectedHandoff.crew_size}</span> : null}{selectedHandoff.estimated_duration_hours ? <span style={styles.laborBadge}>{selectedHandoff.estimated_duration_hours}h duration</span> : null}{selectedHandoff.estimated_duration_hours && end ? <span style={{...styles.laborBadge,...styles.badgeReady}}>End auto-calculated</span> : null}</div></div> : null}\n    {scheduleHint ? <div style={{...styles.note,marginTop:10}} data-wave3-schedule-prefill-hint="true">{scheduleHint}</div> : null}')

          rev = "src/features/wave1/ServiceOSRevenueWorkspace.jsx"
          replace(rev, '  status: { display: "inline-flex", marginTop: 10, padding: "5px 9px", borderRadius: 999, background: "#173A33", color: "#60E7C6", fontSize: 12, fontWeight: 850 },\n  note:', '  status: { display: "inline-flex", marginTop: 10, padding: "5px 9px", borderRadius: 999, background: "#173A33", color: "#60E7C6", fontSize: 12, fontWeight: 850 },\n  laborPills: { display: "flex", gap: 7, flexWrap: "wrap", marginTop: 10 },\n  laborPill: { display: "inline-flex", padding: "4px 8px", borderRadius: 999, border: "1px solid #355064", color: "#C6D6E6", fontSize: 11, fontWeight: 800 },\n  note:')
          replace(rev, '          <div style={styles.status}>READY TO QUOTE · {businessUnitCode}</div>\n          <div style={styles.resultGrid}>', '          <div style={styles.status}>READY TO QUOTE · {businessUnitCode}</div>\n          {(quote.teamSize || quote.jobHours) ? <div style={styles.laborPills} data-testid="serviceos-quote-labor-badges">{quote.teamSize ? <span style={styles.laborPill}>Crew {quote.teamSize}</span> : null}{quote.jobHours ? <span style={styles.laborPill}>{quote.jobHours}h planned</span> : null}</div> : null}\n          <div style={styles.resultGrid}>')

          test = Path('tests/serviceosCanonicalJobDuration.test.mjs')
          text = test.read_text()
          block = '''\n\ntest("operator UI surfaces canonical crew/duration without lifecycle clutter", () => {\n  const operations = fs.readFileSync(new URL("../src/features/wave3/ServiceOSOperationsWorkspace.jsx", import.meta.url), "utf8");\n  const revenue = fs.readFileSync(new URL("../src/features/wave1/ServiceOSRevenueWorkspace.jsx", import.meta.url), "utf8");\n  assert.match(operations, /Ready for Dispatch/);\n  assert.match(operations, /return "Dispatched"/);\n  assert.match(operations, /return "Completed"/);\n  assert.match(operations, /crew_size: crewSize/);\n  assert.match(operations, /data-wave3-dispatch-plan="true"/);\n  assert.match(operations, /End auto-calculated/);\n  assert.match(revenue, /data-testid="serviceos-quote-labor-badges"/);\n  assert.match(revenue, /Crew \\{quote\\.teamSize\\}/);\n});\n'''
          if 'operator UI surfaces canonical crew/duration' not in text:
              test.write_text(text + block)
          PY
      - name: Targeted tests
        run: node --test tests/serviceosCanonicalJobDuration.test.mjs tests/serviceosWave3ProductionBoundary.test.mjs tests/serviceosOfficeQuoteUtils.test.mjs tests/serviceosRevenue.test.mjs
      - name: Full test suite
        run: npm test
      - name: Build
        run: npm run build
      - name: Commit UI polish
        run: |
          rm .github/workflows/ui-polish-apply.yml .github/workflows/ui-polish-apply-v2.yml
          git config user.name "jashive"
          git config user.email "68502405+jashive@users.noreply.github.com"
          git add src/features/wave3/ServiceOSOperationsWorkspace.jsx src/features/wave1/ServiceOSRevenueWorkspace.jsx tests/serviceosCanonicalJobDuration.test.mjs .github/workflows/ui-polish-apply.yml .github/workflows/ui-polish-apply-v2.yml
          git commit -m "Polish dispatch and revenue operator UI"
          git push origin HEAD:feature/dispatch-revenue-ui-polish
