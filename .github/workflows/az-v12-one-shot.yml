name: AZ v1.2 one-shot patch and verify

on:
  push:
    branches:
      - fix/az-residential-v12-coverage

permissions:
  contents: write

jobs:
  patch-and-verify:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/az-residential-v12-coverage
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Patch UI and add regression
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import json

          ui = Path('src/features/wave1/ServiceOSPartialLeadQuoteContinuation.jsx')
          text = ui.read_text()
          old = '{review ? <div style={s.warning}><strong>{review.includes("Requires Management Review / Custom Pricing") ? "Requires Management Review / Custom Pricing" : "Management review required"}:</strong> {review}</div> : null}'
          new = '{review ? <div style={s.warning}><strong>{review.includes("Requires Management Review / Custom Pricing") ? "Requires Management Review / Custom Pricing" : "Management review required"}:</strong> {review.replace(/^Requires Management Review \\/ Custom Pricing:\\s*/i, "")}</div> : null}'
          if old not in text:
              raise SystemExit('Expected management-review banner source not found')
          ui.write_text(text.replace(old, new, 1))

          test = Path('tests/serviceosGoal5ArizonaPricingCoverageV12.test.mjs')
          test.write_text('''import test from "node:test";\nimport assert from "node:assert/strict";\nimport fs from "node:fs";\nimport { computeGovernedResidentialQuote } from "../src/lib/governedResidentialPricing.js";\nimport { getTeamSize, getJobHours } from "../src/core/pricing/sharedPricing.js";\n\nconst configSource = fs.readFileSync("src/lib/governedResidentialConfig.js", "utf8");\nconst migrationSource = fs.readFileSync("supabase/migrations/20260831175500_goal5_az_residential_coverage_v12.sql", "utf8");\nconst continuationSource = fs.readFileSync("src/features/wave1/ServiceOSPartialLeadQuoteContinuation.jsx", "utf8");\n\ntest("HUC-AZ live governed residential version is v1.2", () => {\n  assert.match(configSource, /"HUC-AZ": "AZ-2026-08-v1\\.2"/);\n});\n\ntest("AZ v1.2 preserves Drive authority and expands standard half-bath coverage", () => {\n  assert.match(migrationSource, /1txtaX9EMg12jAGovbkv4SUyGlZLSVvReq1u6wfxDsYw/);\n  assert.match(migrationSource, /generate_series\\(1\\.0::numeric,4\\.0::numeric,0\\.5::numeric\\)/);\n  assert.match(migrationSource, /generate_series\\(1\\.0::numeric,4\\.5::numeric,0\\.5::numeric\\)/);\n  assert.match(migrationSource, /generate_series\\(1\\.0::numeric,5\\.0::numeric,0\\.5::numeric\\)/);\n  assert.match(migrationSource, /'half_bath_increment',15/);\n});\n\ntest("Santress 3 bed 2.5 bath apartment Essential Refresh is a normal governed AZ quote", () => {\n  const configurationVersion = {\n    version: "AZ-2026-08-v1.2",\n    configuration: {\n      currency_code: "USD",\n      dwelling_matrix: {\n        apartments_condos: {\n          "3bed_2_5bath": {\n            essential_refresh: 235,\n            signature_initial_reset: 295,\n            complete_deep: 385,\n            move_in_move_out: 315\n          }\n        }\n      },\n      condition_adjustments: { light: { minimum_markup: 0, maximum_markup: 0 } },\n      recurring_service: {},\n      minimum_charge: { general_residential: 60 },\n      premium_addons: {},\n      tax: { rate: 0, label: "SERVICE TAX" }\n    }\n  };\n  const quote = computeGovernedResidentialQuote({\n    configurationVersion,\n    dwellingType: "Apartment / Condo",\n    beds: 3,\n    baths: 2.5,\n    packageKey: "essential_refresh",\n    condition: "light",\n    frequency: "one_time",\n    addons: [],\n    approvedSelections: { teamSize: getTeamSize(1352), jobHours: getJobHours(1352) }\n  });\n  assert.equal(quote.requiresOfficeReview, undefined);\n  assert.equal(quote.currencyCode, "USD");\n  assert.equal(quote.preTaxTotal, 235);\n  assert.equal(quote.taxAmount, 0);\n  assert.equal(quote.total, 235);\n  assert.equal(quote.teamSize, 2);\n  assert.equal(quote.jobHours, 1.5);\n});\n\ntest("saved-lead review banner strips an already-present management-review prefix", () => {\n  assert.match(continuationSource, /review\\.replace\\(\\/\\^Requires Management Review \\\\/ Custom Pricing:/);\n});\n\ntest("saved-lead customer identity comes from lead requirements, not operator display text", () => {\n  assert.match(continuationSource, /const customer = req\\.customer \\|\\| \\{\\}/);\n  assert.match(continuationSource, /customerName: text\\(customer\\.name\\)/);\n  assert.match(continuationSource, /const appUserId = revenueContext\\?\\.appUserId \\?\\? null/);\n  assert.doesNotMatch(continuationSource, /customerName:\\s*(?:revenueContext|session|appUserId)/);\n});\n''')

          package_path = Path('package.json')
          package = json.loads(package_path.read_text())
          needle = 'tests/serviceosGoal5MultiMarketRevenue.test.mjs'
          addition = 'tests/serviceosGoal5ArizonaPricingCoverageV12.test.mjs'
          if addition not in package['scripts']['test']:
              package['scripts']['test'] = package['scripts']['test'].replace(needle, needle + ' ' + addition)
          package_path.write_text(json.dumps(package, indent=2) + '\n')
          PY
      - name: Install
        run: npm ci
      - name: Targeted AZ v1.2 regression
        run: node --test tests/serviceosGoal5ArizonaPricingCoverageV12.test.mjs tests/serviceosGoal5MultiMarketRevenue.test.mjs tests/serviceosGoal5PartialLeadQuoteContinuation.test.mjs tests/serviceosGovernedConfigSessionRefresh.test.mjs tests/serviceosCanonicalJobDuration.test.mjs
      - name: Full regression
        run: npm test
      - name: Production build
        run: npm run build
      - name: Commit verified patch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/features/wave1/ServiceOSPartialLeadQuoteContinuation.jsx tests/serviceosGoal5ArizonaPricingCoverageV12.test.mjs package.json
          git diff --cached --quiet && exit 0
          git commit -m "Harden AZ v1.2 quote coverage UI and regressions"
          git push origin HEAD:fix/az-residential-v12-coverage
