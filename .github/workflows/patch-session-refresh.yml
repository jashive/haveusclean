name: One-shot ServiceOS session refresh patch

on:
  push:
    branches:
      - fix/session-refresh-governed-config
    paths:
      - .github/workflows/patch-session-refresh.yml

permissions:
  contents: write

jobs:
  patch-test-commit:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/session-refresh-governed-config
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - name: Apply governed-config refresh patch
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          def replace_once(path, old, new):
              p = Path(path)
              s = p.read_text()
              count = s.count(old)
              if count != 1:
                  raise SystemExit(f'{path}: expected exactly one match, found {count}: {old!r}')
              p.write_text(s.replace(old, new, 1))

          replace_once(
              'src/lib/governedResidentialConfig.js',
              'import { authenticatedRestFetch } from "./serviceosAuthClient.js";',
              'import { authenticatedRestFetchWithRefresh } from "./serviceosAuthClient.js";',
          )
          replace_once(
              'src/lib/governedResidentialConfig.js',
              '  fetcher = authenticatedRestFetch,',
              '  fetcher = null,',
          )
          replace_once(
              'src/lib/governedResidentialConfig.js',
              '  const res = await fetcher(path, accessToken);',
              '  const res = fetcher\n    ? await fetcher(path, accessToken)\n    : await authenticatedRestFetchWithRefresh(path);',
          )

          test = Path('tests/serviceosGovernedConfigSessionRefresh.test.mjs')
          if test.exists():
              raise SystemExit('session refresh test already exists unexpectedly')
          test.write_text('''import test from "node:test";\nimport assert from "node:assert/strict";\nimport fs from "node:fs";\n\nconst source = fs.readFileSync("src/lib/governedResidentialConfig.js", "utf8");\n\ntest("live governed config lookup uses refresh-aware ServiceOS transport", () => {\n  assert.match(source, /import \\{ authenticatedRestFetchWithRefresh \\} from "\\.\\/serviceosAuthClient\\.js"/);\n  assert.match(source, /fetcher = null/);\n  assert.match(source, /fetcher\\s*\\? await fetcher\\(path, accessToken\\)\\s*:\\s*await authenticatedRestFetchWithRefresh\\(path\\)/s);\n  assert.doesNotMatch(source, /fetcher = authenticatedRestFetch/);\n});\n\ntest("injected governed-config fetcher remains token-aware for deterministic tests", () => {\n  assert.match(source, /await fetcher\\(path, accessToken\\)/);\n  assert.match(source, /if \\(!accessToken\\) throw new Error\\("Governed residential config lookup failed: accessToken required"\\)/);\n});\n''')

          replace_once(
              'package.json',
              'tests/serviceosAuthClient.test.mjs tests/serviceosPasswordSetup.test.mjs',
              'tests/serviceosAuthClient.test.mjs tests/serviceosGovernedConfigSessionRefresh.test.mjs tests/serviceosPasswordSetup.test.mjs',
          )
          PY
      - run: npm ci
      - name: Targeted auth and quote regressions
        run: node --test tests/serviceosAuthClient.test.mjs tests/serviceosGovernedConfigSessionRefresh.test.mjs tests/serviceosRevenue.test.mjs tests/serviceosGoal5QuoteRevision.test.mjs tests/serviceosGoal5PartialLeadQuoteContinuation.test.mjs tests/serviceosGoal5OntarioPricingCoverage.test.mjs
      - name: Full regression
        run: npm test
      - name: Production build
        run: npm run build
      - name: Commit tested patch
        shell: bash
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add src/lib/governedResidentialConfig.js tests/serviceosGovernedConfigSessionRefresh.test.mjs package.json
          git commit -m "Refresh session for governed pricing config lookups"
          git push origin HEAD:fix/session-refresh-governed-config
