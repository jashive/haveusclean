          set -euo pipefail
          git reset --hard HEAD >/dev/null
          test "$(git rev-parse HEAD)" = "$EXPECTED_CANDIDATE_SHA"
          echo "PASS: exact PR17 candidate remained unchanged by Acceptance OAT"