name: ServiceOS Wave 2-5 Acceptance Train

on:
  pull_request:
    branches:
      - test/wave2-revenue-production-smoke

permissions:
  contents: read

jobs:
  acceptance-train:
    name: Wave 2 Revenue -> Wave 3 Operations -> Wave 4 QA -> Wave 5 Finance
    runs-on: ubuntu-latest
    timeout-minutes: 45

    env:
      EXPECTED_CANDIDATE_SHA: 2350d6d884fdf3bde48316dbb4ccff234a3adefe
      ACCEPTANCE_SUPABASE_URL: https://hqeamecwdsrjfjybrsox.supabase.co
      BASE_URL: http://localhost:3000
      SERVICEOS_OAT_OWNER_EMAIL: serviceos.owner.acceptance@example.com
      SERVICEOS_OAT_OFFICE_EMAIL: serviceos.office.acceptance@example.com
      SERVICEOS_OAT_WORKER_EMAIL: serviceos.worker.acceptance@example.com
      SERVICEOS_OAT_QA_EMAIL: serviceos.qa.acceptance@example.com

    steps:
      - name: Checkout exact PR 17 candidate
        uses: actions/checkout@v4
        with:
          ref: ${{ env.EXPECTED_CANDIDATE_SHA }}
          fetch-depth: 0

      - name: Verify exact source and approved Acceptance target
        shell: bash
        env:
          SUPABASE_URL: ${{ env.ACCEPTANCE_SUPABASE_URL }}
          SERVICEOS_ACCEPTANCE_MUTATIONS_APPROVED: "true"
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$EXPECTED_CANDIDATE_SHA"
          test "$SUPABASE_URL" = "https://hqeamecwdsrjfjybrsox.supabase.co"
          case "$SUPABASE_URL" in *opazwghrohmfykzxxsjk*) echo "CRITICAL: Production Supabase prohibited"; exit 1;; esac
          node scripts/serviceos-acceptance-preflight.mjs --mutation

      - name: Verify protected Acceptance credentials are available
        shell: bash
        env:
          SERVICEOS_ACCEPTANCE_SUPABASE_ANON_KEY: ${{ secrets.SERVICEOS_ACCEPTANCE_SUPABASE_ANON_KEY }}
          SERVICEOS_ACCEPTANCE_SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SERVICEOS_ACCEPTANCE_SUPABASE_SERVICE_ROLE_KEY }}
          SERVICEOS_OAT_OWNER_PASSWORD: ${{ secrets.SERVICEOS_OAT_OWNER_PASSWORD }}
          SERVICEOS_OAT_OFFICE_PASSWORD: ${{ secrets.SERVICEOS_OAT_OFFICE_PASSWORD }}
          SERVICEOS_OAT_WORKER_PASSWORD: ${{ secrets.SERVICEOS_OAT_WORKER_PASSWORD }}
          SERVICEOS_OAT_QA_PASSWORD: ${{ secrets.SERVICEOS_OAT_QA_PASSWORD }}
        run: |
          set -euo pipefail
          missing=0
          for name in SERVICEOS_ACCEPTANCE_SUPABASE_ANON_KEY SERVICEOS_ACCEPTANCE_SUPABASE_SERVICE_ROLE_KEY SERVICEOS_OAT_OWNER_PASSWORD SERVICEOS_OAT_OFFICE_PASSWORD SERVICEOS_OAT_WORKER_PASSWORD SERVICEOS_OAT_QA_PASSWORD; do
            if [ -z "${!name:-}" ]; then echo "$name=MISSING"; missing=1; else echo "$name=SET"; fi
          done
          exit "$missing"

      - name: Diagnose office_ops canonical auth context before browser work
        shell: bash
        env:
          SUPABASE_URL: ${{ env.ACCEPTANCE_SUPABASE_URL }}
          SUPABASE_ANON_KEY: ${{ secrets.SERVICEOS_ACCEPTANCE_SUPABASE_ANON_KEY }}
          OFFICE_EMAIL: ${{ env.SERVICEOS_OAT_OFFICE_EMAIL }}
          OFFICE_PASSWORD: ${{ secrets.SERVICEOS_OAT_OFFICE_PASSWORD }}
        run: |
          set -euo pipefail
          node --input-type=module <<'NODE'
          const url = String(process.env.SUPABASE_URL || '').replace(/\/$/, '');
          const anon = String(process.env.SUPABASE_ANON_KEY || '');
          const email = String(process.env.OFFICE_EMAIL || '');
          const password = String(process.env.OFFICE_PASSWORD || '');
          const expected = 'https://hqeamecwdsrjfjybrsox.supabase.co';
          if (url !== expected || url.includes('opazwghrohmfykzxxsjk')) throw new Error('Acceptance auth diagnostic target is not the approved isolated project');
          if (!anon || !email || !password) throw new Error('Acceptance auth diagnostic inputs are missing');

          async function jsonSafe(response) {
            const text = await response.text();
            if (!text) return null;
            try { return JSON.parse(text); } catch { return null; }
          }
          function message(body, fallback) {
            return body?.message || body?.error_description || body?.msg || fallback;
          }
          const auth = await fetch(`${url}/auth/v1/token?grant_type=password`, {
            method: 'POST',
            headers: { apikey: anon, 'content-type': 'application/json' },
            body: JSON.stringify({ email, password }),
          });
          const authBody = await jsonSafe(auth);
          if (!auth.ok) throw new Error(`office_ops password exchange failed HTTP ${auth.status}: ${message(authBody, 'authentication rejected')}`);
          const token = authBody?.access_token;
          const authUserId = authBody?.user?.id;
          if (!token || !authUserId) throw new Error('office_ops password exchange returned no usable session');

          const headers = { apikey: anon, authorization: `Bearer ${token}`, 'content-type': 'application/json' };
          async function read(path, label) {
            const response = await fetch(`${url}/rest/v1/${path}`, { headers });
            const body = await jsonSafe(response);
            if (!response.ok) throw new Error(`${label} failed HTTP ${response.status}: ${message(body, 'REST validation rejected')}`);
            return body;
          }

          const orgs = await read('organization?select=id,code,name&order=id.asc&limit=2', 'organization validation');
          if (!Array.isArray(orgs) || orgs.length !== 1) throw new Error(`organization validation expected 1 row, found ${Array.isArray(orgs) ? orgs.length : 'invalid response'}`);
          const orgId = orgs[0].id;
          const bus = await read(`business_unit?select=id,organization_id,code,name,jurisdiction_id&organization_id=eq.${encodeURIComponent(orgId)}&order=code.asc`, 'business unit validation');
          if (!Array.isArray(bus) || bus.length < 1) throw new Error('business unit validation returned no visible rows');
          const appUsers = await read(`app_user?select=id,auth_user_id,status&auth_user_id=eq.${encodeURIComponent(authUserId)}`, 'app_user validation');
          if (!Array.isArray(appUsers) || appUsers.length !== 1 || appUsers[0]?.status !== 'active') throw new Error('app_user validation did not resolve exactly one active identity');
          const roles = await read('app_role?select=id,code&code=in.(owner_admin,office_ops,worker,qa)', 'canonical role validation');
          if (!Array.isArray(roles) || roles.length !== 4) throw new Error(`canonical role validation expected 4 roles, found ${Array.isArray(roles) ? roles.length : 'invalid response'}`);
          const memberships = await read(`user_membership?select=role_id,status&app_user_id=eq.${encodeURIComponent(appUsers[0].id)}&organization_id=eq.${encodeURIComponent(orgId)}&status=eq.active`, 'membership validation');
          if (!Array.isArray(memberships) || memberships.length < 1) throw new Error('membership validation returned no active rows');
          const roleById = new Map(roles.map((role) => [role.id, role.code]));
          const roleCodes = [...new Set(memberships.map((membership) => roleById.get(membership.role_id)))];
          if (roleCodes.length !== 1 || roleCodes[0] !== 'office_ops') throw new Error(`membership role mismatch: expected office_ops, found ${roleCodes.filter(Boolean).join(',') || 'unresolved'}`);
          await read('customer?select=id&limit=1', 'customer access validation');

          console.log(JSON.stringify({
            status: 'PASS',
            check: 'office_ops-direct-auth-and-canonical-context',
            organizationCount: orgs.length,
            businessUnitCount: bus.length,
            appUserCount: appUsers.length,
            canonicalRoleCount: roles.length,
            activeMembershipCount: memberships.length,
            resolvedRole: roleCodes[0],
            customerAccess: 'PASS',
          }));
          NODE

      - name: Ensure governed residential pricing contract exists in Acceptance
        shell: bash
        env:
          SUPABASE_URL: ${{ env.ACCEPTANCE_SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SERVICEOS_ACCEPTANCE_SUPABASE_SERVICE_ROLE_KEY }}
        run: |
          set -euo pipefail
          node --input-type=module <<'NODE'
          const url = String(process.env.SUPABASE_URL || '').replace(/\/$/, '');
          const serviceKey = String(process.env.SUPABASE_SERVICE_ROLE_KEY || '');
          const expected = 'https://hqeamecwdsrjfjybrsox.supabase.co';
          if (url !== expected || url.includes('opazwghrohmfykzxxsjk')) throw new Error('Governed config bootstrap target is not approved Acceptance');
          if (!serviceKey) throw new Error('Acceptance service-role key missing');
          const headers = { apikey: serviceKey, authorization: `Bearer ${serviceKey}`, 'content-type': 'application/json' };
          async function json(response, label) {
            const text = await response.text();
            let body = null;
            if (text) { try { body = JSON.parse(text); } catch {} }
            if (!response.ok) throw new Error(`${label} failed HTTP ${response.status}: ${body?.message || body?.error || text || 'request rejected'}`);
            return body;
          }
          async function get(path, label) {
            return json(await fetch(`${url}/rest/v1/${path}`, { headers }), label);
          }
          const orgs = await get('organization?select=id&order=id.asc&limit=2', 'organization lookup');
          if (!Array.isArray(orgs) || orgs.length !== 1) throw new Error(`Acceptance bootstrap expected exactly 1 organization, found ${Array.isArray(orgs) ? orgs.length : 'invalid'}`);
          const orgId = orgs[0].id;
          const bus = await get(`business_unit?select=id,jurisdiction_id&organization_id=eq.${encodeURIComponent(orgId)}&order=id.asc&limit=2`, 'business unit lookup');
          if (!Array.isArray(bus) || bus.length !== 1 || !bus[0].jurisdiction_id) throw new Error(`Acceptance bootstrap expected exactly 1 jurisdiction-bound business unit, found ${Array.isArray(bus) ? bus.length : 'invalid'}`);
          const businessUnitId = bus[0].id;
          const jurisdictionId = bus[0].jurisdiction_id;
          const filter = `configuration_version?select=id,organization_id,business_unit_id,jurisdiction_id,configuration_type,version,status,configuration&organization_id=eq.${encodeURIComponent(orgId)}&business_unit_id=eq.${encodeURIComponent(businessUnitId)}&jurisdiction_id=eq.${encodeURIComponent(jurisdictionId)}&configuration_type=eq.residential_pricing&version=eq.ON-2026-08-v1.0&status=eq.published&limit=2`;
          let rows = await get(filter, 'governed config lookup');
          if (!Array.isArray(rows)) throw new Error('Governed config lookup returned invalid response');
          if (rows.length > 1) throw new Error(`Governed config bootstrap refuses ambiguous state: ${rows.length} matching rows`);

          const configuration = {
            schema_version: '1.0.0',
            service_family: 'residential',
            brand: 'HaveUsClean',
            business_unit_code: 'ON',
            jurisdiction_code: 'ON',
            currency_code: 'CAD',
            authority: 'configuration_version',
            tax: { label: 'HST', rate: 0.13, applies_to_final_subtotal: true },
            minimum_charge: {
              general_residential: 200,
              partial_cleaning: 200,
              move_in_move_out: 200,
              tax_extra: true,
              exceptions: ['approved recurring appointments', 'smaller Essential Refresh services specifically listed in the matrix'],
              management_approval_required_below_minimum: true,
            },
            dwelling_matrix: {
              apartments_condos: {
                '2bed_2bath': { sqft_min: 850, sqft_max: 1100, essential_refresh: 200, signature_initial_reset: 275, complete_deep: 395, move_in_move_out: 260 },
              },
              townhouses: {
                '3bed_2_5bath': { sqft_min: 1300, sqft_max: 1800, essential_refresh: 275, signature_initial_reset: 350, complete_deep: 470, move_in_move_out: 325 },
              },
              semi_detached_detached: {
                '4bed_2_5bath': { sqft_min: 1800, sqft_max: 2300, essential_refresh: 325, signature_initial_reset: 425, complete_deep: 545, move_in_move_out: 400 },
              },
            },
            packages: {
              essential_refresh: { label: 'Essential Refresh Clean' },
              signature_initial_reset: { label: 'Signature Initial Reset Clean' },
              complete_deep: { label: 'Complete Deep Clean' },
              move_in_move_out: { label: 'Move-In / Move-Out Clean' },
            },
            kitchen_bath_packages: {},
            bathroom_only: {},
            partial_cleaning: {},
            move_in_move_out_addons: {},
            premium_addons: {},
            recurring_service: {
              new_customer_first_visit_recommendation: 'Signature Initial Reset Clean',
              ongoing_baseline: 'Essential Refresh Clean',
              weekly_discount: { min: 0.1, max: 0.15 },
              biweekly_discount: { min: 0.05, max: 0.1 },
              monthly_discount: { min: 0, max: 0.05 },
              heavy_work_automatic_discount: false,
            },
            condition_adjustments: {
              light: { minimum_markup: 0, maximum_markup: 0, instruction: 'Use starting price' },
              moderate: { minimum_markup: 0.1, maximum_markup: 0.15 },
              heavy: { minimum_markup: 0.2, maximum_markup: 0.35 },
              custom_quote_required_for: ['biohazard'],
            },
            urgency: {
              same_day_subject_to_availability: true,
              small_job_premium: { minimum: 25, maximum: 50 },
              larger_job_premium: { minimum: 50, maximum: 100 },
              evening_holiday_urgent_dispatch: 'custom_based_on_staffing',
              waiver_requires_operational_reason_or_management_approval: true,
            },
            square_footage_adjustments: {
              use_dwelling_matrix_inside_typical_range: true,
              additional_250_500_sqft: { minimum: 25, maximum: 50 },
              additional_500_1000_sqft: { minimum: 50, maximum: 100 },
              more_than_1000_sqft_above_typical: 'custom_quote_recommended',
              additional_factors: ['layout complexity'],
            },
            quote_controls: {},
          };

          if (rows.length === 0) {
            const payload = {
              organization_id: orgId,
              business_unit_id: businessUnitId,
              jurisdiction_id: jurisdictionId,
              configuration_type: 'residential_pricing',
              version: 'ON-2026-08-v1.0',
              status: 'published',
              effective_from: '2026-08-01T00:00:00Z',
              effective_to: null,
              configuration,
            };
            const response = await fetch(`${url}/rest/v1/configuration_version`, {
              method: 'POST',
              headers: { ...headers, prefer: 'return=representation' },
              body: JSON.stringify(payload),
            });
            rows = await json(response, 'governed config insert');
            if (!Array.isArray(rows) || rows.length !== 1) throw new Error('Governed config insert did not return exactly one row');
            console.log(JSON.stringify({ status: 'PASS', action: 'seeded', version: 'ON-2026-08-v1.0', target: 'Acceptance-only' }));
          } else {
            const cfg = rows[0]?.configuration;
            if (cfg?.tax?.rate !== 0.13 || cfg?.minimum_charge?.general_residential !== 200 || cfg?.dwelling_matrix?.apartments_condos?.['2bed_2bath']?.complete_deep !== 395) {
              throw new Error('Existing governed Acceptance config conflicts with PR17 canonical Revenue contract; refusing overwrite');
            }
            console.log(JSON.stringify({ status: 'PASS', action: 'existing-contract-verified', version: 'ON-2026-08-v1.0', target: 'Acceptance-only' }));
          }
          NODE

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build isolated Acceptance application with Waves 2-5 enabled
        env:
          VITE_SUPABASE_URL: ${{ env.ACCEPTANCE_SUPABASE_URL }}
          VITE_SUPABASE_ANON_KEY: ${{ secrets.SERVICEOS_ACCEPTANCE_SUPABASE_ANON_KEY }}
          VITE_SERVICEOS_ENVIRONMENT: acceptance
          VITE_SERVICEOS_ENABLED: "true"
          VITE_SERVICEOS_AUTH_ENABLED: "true"
          VITE_SERVICEOS_REVENUE_ENABLED: "true"
          VITE_SERVICEOS_REVENUE_PILOT_UI: "true"
          VITE_SERVICEOS_OPERATIONS_ENABLED: "true"
          VITE_SERVICEOS_OPERATIONS_PILOT_UI: "true"
          VITE_SERVICEOS_WAVE4_PILOT_UI: "true"
          VITE_SERVICEOS_FINANCE_ENABLED: "true"
          VITE_SERVICEOS_WAVE5_PILOT_UI: "true"
          VITE_SERVICEOS_W6_INTELLIGENCE_ENABLED: "false"
        run: npm run build

      - name: Prepare localhost-only Wave 2 and Wave 2-5 harnesses
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin serviceos-oat-runner:refs/remotes/origin/serviceos-oat-runner
          git show refs/remotes/origin/serviceos-oat-runner:scripts/serviceos-full-live-oat.mjs > scripts/serviceos-wave2-5-live-oat.mjs

          node --input-type=module <<'NODE'
          import fs from 'node:fs';

          const wave2Path = 'scripts/wave2-revenue-smoke-test.mjs';
          let wave2 = fs.readFileSync(wave2Path, 'utf8');
          const protocolGuard = 'assert.equal(target.protocol, "https:", "Wave 2 smoke target must use HTTPS");';
          if (!wave2.includes(protocolGuard)) throw new Error('Wave 2 HTTPS guard not found');
          wave2 = wave2.replace(protocolGuard, 'assert(target.protocol === "https:" || (target.protocol === "http:" && target.hostname === "localhost"), "Wave 2 smoke target must use HTTPS or isolated localhost HTTP");');

          const loginMarker = '  await page.locator(`[data-revenue-authorized]`).waitFor({ state: "visible", timeout: DEFAULT_TIMEOUT_MS });';
          const loginReplacement = `  try {\n    await page.locator('[data-canonical-workspace="true"]').waitFor({ state: "visible", timeout: DEFAULT_TIMEOUT_MS });\n  } catch (error) {\n    const bodyText = redact(await page.locator("body").innerText().catch(() => ""));\n    throw new Error("Canonical workspace did not render after " + expectedRole + " sign-in. Sanitized UI state: " + bodyText.slice(0, 800) + "\\n" + redact(error));\n  }\n  await page.locator('[data-revenue-authorized]').waitFor({ state: "visible", timeout: DEFAULT_TIMEOUT_MS });`;
          if (!wave2.includes(loginMarker)) throw new Error('Wave 2 login marker wait not found');
          wave2 = wave2.replace(loginMarker, loginReplacement);

          const ownerSuccessMarker = '    await page.getByText("Pipeline complete — conversion_record created, Wave 3 job_handoff boundary set", { exact: true })\n      .waitFor({ state: "visible", timeout: DEFAULT_TIMEOUT_MS });';
          const ownerSuccessReplacement = `    try {\n      await page.getByText("Pipeline complete — conversion_record created, Wave 3 job_handoff boundary set", { exact: true })\n        .waitFor({ state: "visible", timeout: DEFAULT_TIMEOUT_MS });\n    } catch (error) {\n      const panelText = redact(await panel.innerText().catch(() => ""));\n      throw new Error("Wave 2 owner pipeline did not reach completion. Sanitized pilot state: " + panelText.slice(0, 1600) + "\\n" + redact(error));\n    }`;
          if (!wave2.includes(ownerSuccessMarker)) throw new Error('Wave 2 owner success wait marker not found');
          wave2 = wave2.replace(ownerSuccessMarker, ownerSuccessReplacement);
          fs.writeFileSync(wave2Path, wave2);

          const path = 'scripts/serviceos-wave2-5-live-oat.mjs';
          let source = fs.readFileSync(path, 'utf8');
          const oldHost = 'haveusclean-k872t00xl-jasons-projects-54483428.vercel.app';
          const candidate = '2350d6d884fdf3bde48316dbb4ccff234a3adefe';

          source = source.replace(`const EXPECTED_BASE_HOST = "${oldHost}";`, 'const EXPECTED_BASE_HOST = "localhost";');
          source = source.replace('const runId = `TEST-W6-FULL-${new Date().toISOString().replace(/[-:.TZ]/g, "").slice(0, 14)}`;', 'const runId = `TEST-W2-5-FULL-${new Date().toISOString().replace(/[-:.TZ]/g, "").slice(0, 14)}`;');
          source = source.replace('    "VERCEL_AUTOMATION_BYPASS_SECRET",\n', '');
          source = source.replace('assert(base.protocol === "https:", "BASE_URL must be HTTPS", "BLOCKER");', 'assert(base.protocol === "http:", "BASE_URL must be HTTP for the isolated local runner", "BLOCKER");');
          source = source.replace('"BASE_URL is not the exact authoritative Preview"', '"BASE_URL is not the exact isolated local runner"');
          source = source.replace('`protected Preview navigation escaped authoritative host: ${current.hostname}`', '`local runner navigation escaped localhost: ${current.hostname}`');
          source = source.replace('assert(url.hostname === EXPECTED_BASE_HOST, "Preview API request escaped authoritative host", "CRITICAL");', 'assert(url.hostname === EXPECTED_BASE_HOST, "Local API request escaped localhost", "CRITICAL");');
          source = source.replace('433d4f64f6d7ba34863a03b7421e92543dd28818', candidate);

          const routeStart = source.indexOf('  const bypassSecret = process.env.VERCEL_AUTOMATION_BYPASS_SECRET;');
          const routeEnd = source.indexOf('  const page = await context.newPage();', routeStart);
          if (routeStart < 0 || routeEnd < 0) throw new Error('expected Vercel route-injection block not found');
          source = source.slice(0, routeStart) + source.slice(routeEnd);
          source = source.replace(/\n\s*"x-vercel-protection-bypass": process\.env\.VERCEL_AUTOMATION_BYPASS_SECRET,/, '');

          const stopPoint = '    report.phases.idempotencyConcurrency = "PASS";\n\n    const kpiDefs';
          if (!source.includes(stopPoint)) throw new Error('Wave 5 stop point not found');
          source = source.replace(stopPoint, `    report.phases.idempotencyConcurrency = "PASS";\n    report.status = "PASS";\n    report.evidence = { operationalJobId: job.id, qaFailId: qaFail.id, qaPassId: qaPass.id, invoiceRequestId: invoice.id, paymentObservationId: payment.id, contractorPayableId: payable.id, profitabilitySnapshotId: profitability.id };\n    process.stdout.write(\`${'${JSON.stringify(report, null, 2)}'}\\n\`);\n    return;\n\n    const kpiDefs`);

          fs.writeFileSync(path, source);
          NODE

          node --check scripts/wave2-revenue-smoke-test.mjs
          node --check scripts/serviceos-wave2-5-live-oat.mjs
          grep -q 'const EXPECTED_BASE_HOST = "localhost"' scripts/serviceos-wave2-5-live-oat.mjs
          grep -q 'candidateSha: "2350d6d884fdf3bde48316dbb4ccff234a3adefe"' scripts/serviceos-wave2-5-live-oat.mjs
          grep -q 'report.phases.finance = "PASS"' scripts/serviceos-wave2-5-live-oat.mjs
          grep -q 'report.phases.idempotencyConcurrency = "PASS"' scripts/serviceos-wave2-5-live-oat.mjs
          grep -q 'data-canonical-workspace' scripts/wave2-revenue-smoke-test.mjs
          grep -q 'Wave 2 owner pipeline did not reach completion' scripts/wave2-revenue-smoke-test.mjs
          echo "PASS: exact PR17 Wave 2-5 harness prepared; Wave 6 excluded; login and owner-pipeline diagnostics enabled"

      - name: Install Chromium
        run: npx playwright install --with-deps chromium

      - name: Start isolated local app and run Wave 2 through Wave 5
        shell: bash
        env:
          SUPABASE_URL: ${{ env.ACCEPTANCE_SUPABASE_URL }}
          SUPABASE_ANON_KEY: ${{ secrets.SERVICEOS_ACCEPTANCE_SUPABASE_ANON_KEY }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SERVICEOS_ACCEPTANCE_SUPABASE_SERVICE_ROLE_KEY }}
          SERVICEOS_ENVIRONMENT: test
          SERVICEOS_W5_PREVIEW_PAYMENT_ENABLED: "true"
          SERVICEOS_ACCEPTANCE_MUTATIONS_APPROVED: "true"
          SERVICEOS_OAT_OWNER_PASSWORD: ${{ secrets.SERVICEOS_OAT_OWNER_PASSWORD }}
          SERVICEOS_OAT_OFFICE_PASSWORD: ${{ secrets.SERVICEOS_OAT_OFFICE_PASSWORD }}
          SERVICEOS_OAT_WORKER_PASSWORD: ${{ secrets.SERVICEOS_OAT_WORKER_PASSWORD }}
          SERVICEOS_OAT_QA_PASSWORD: ${{ secrets.SERVICEOS_OAT_QA_PASSWORD }}
        run: |
          set -euo pipefail
          server="$RUNNER_TEMP/serviceos-wave2-5-server.mjs"
          log="$RUNNER_TEMP/serviceos-wave2-5-server.log"
          cat > "$server" <<'NODE'
          import http from 'node:http';
          import fs from 'node:fs';
          import path from 'node:path';
          import { pathToFileURL } from 'node:url';
          const ACCEPTANCE_REF = 'hqeamecwdsrjfjybrsox';
          const PRODUCTION_REF = 'opazwghrohmfykzxxsjk';
          const expectedUrl = `https://${ACCEPTANCE_REF}.supabase.co`;
          if (process.env.SUPABASE_URL !== expectedUrl) throw new Error('local server is not pinned to approved Acceptance Supabase');
          if (process.env.SUPABASE_URL.includes(PRODUCTION_REF)) throw new Error('Production Supabase target prohibited');
          if (!process.env.SUPABASE_ANON_KEY || !process.env.SUPABASE_SERVICE_ROLE_KEY) throw new Error('Acceptance Supabase keys missing');
          if (process.env.SERVICEOS_ENVIRONMENT !== 'test') throw new Error('SERVICEOS_ENVIRONMENT must be test');
          if (process.env.SERVICEOS_W5_PREVIEW_PAYMENT_ENABLED !== 'true') throw new Error('Wave 5 preview payment must be explicitly enabled');
          const { default: paymentHandler } = await import(pathToFileURL(path.resolve('api/wave5-preview-payment.js')).href);
          const dist = path.resolve('dist');
          const types = new Map([['.html','text/html; charset=utf-8'],['.js','text/javascript; charset=utf-8'],['.css','text/css; charset=utf-8'],['.json','application/json; charset=utf-8'],['.svg','image/svg+xml'],['.png','image/png'],['.jpg','image/jpeg'],['.jpeg','image/jpeg'],['.ico','image/x-icon']]);
          function sendJson(res,status,value){res.writeHead(status,{'content-type':'application/json; charset=utf-8','cache-control':'no-store'});res.end(JSON.stringify(value));}
          async function readBody(req){let raw='';for await(const chunk of req) raw+=chunk;return raw?JSON.parse(raw):{};}
          function serveFile(res,file){const ext=path.extname(file).toLowerCase();res.writeHead(200,{'content-type':types.get(ext)||'application/octet-stream','cache-control':'no-store'});fs.createReadStream(file).pipe(res);}
          const server=http.createServer(async(req,res)=>{try{const url=new URL(req.url||'/','http://localhost:3000');if(url.pathname==='/__oat/health')return sendJson(res,200,{status:'PASS',projectRef:ACCEPTANCE_REF,environment:'test'});if(url.pathname==='/api/wave5-preview-payment'){let body;try{body=await readBody(req);}catch{return sendJson(res,400,{success:false,error:'Request body must be valid JSON'});}let statusCode=200;let sent=false;const response={status(code){statusCode=code;return this;},json(payload){if(!sent){sent=true;sendJson(res,statusCode,payload);}return this;}};await paymentHandler({method:req.method,headers:req.headers,body},response);if(!sent)sendJson(res,500,{success:false,error:'Local API handler returned without a response'});return;}const requested=url.pathname==='/'?'index.html':decodeURIComponent(url.pathname.slice(1));let file=path.resolve(dist,requested);if(!file.startsWith(dist+path.sep)&&file!==path.join(dist,'index.html'))return sendJson(res,403,{error:'Forbidden'});if(!fs.existsSync(file)||!fs.statSync(file).isFile())file=path.join(dist,'index.html');serveFile(res,file);}catch(error){console.error('local-server-error',error?.message||error);if(!res.headersSent)sendJson(res,500,{error:'Local OAT server failure'});else res.end();}});
          server.listen(3000,'0.0.0.0',()=>console.log('ServiceOS Wave 2-5 local server listening on http://localhost:3000'));
          NODE
          node "$server" > "$log" 2>&1 &
          server_pid=$!
          trap 'kill "$server_pid" 2>/dev/null || true' EXIT
          ready=0
          for attempt in $(seq 1 30); do
            if curl --silent --fail http://localhost:3000/__oat/health > "$RUNNER_TEMP/serviceos-wave2-5-health.json"; then ready=1; break; fi
            sleep 1
          done
          if [ "$ready" -ne 1 ]; then echo "BLOCKED: local ServiceOS server did not become healthy"; cat "$log" || true; exit 1; fi
          cat "$RUNNER_TEMP/serviceos-wave2-5-health.json"
          echo "=== WAVE 2 UI PLAYWRIGHT + CLEANUP ==="
          npm run smoke:wave2
          echo "=== WAVES 3-5 ACCEPTANCE TRAIN ==="
          node scripts/serviceos-wave2-5-live-oat.mjs

