name: ServiceOS Release Hardening Runner

on:
  push:
    branches:
      - serviceos-release-hardening-runner

permissions:
  contents: write

jobs:
  harden:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout isolated helper
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Check run request
        id: request
        shell: bash
        run: |
          set -euo pipefail
          if [ ! -f .github/serviceos-release-hardening.request ]; then
            echo "run=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          if [ -f .github/serviceos-release-hardening.result ]; then
            echo "run=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          echo "run=true" >> "$GITHUB_OUTPUT"

      - name: Apply patch and run final verification
        if: steps.request.outputs.run == 'true'
        shell: bash
        env:
          TARGET_BRANCH: copilot/agentwave1-auth-rls-v2
          EXPECTED_TARGET_SHA: 7a3a8a53d2a6cb8073350cf0890c3206e9600800
          ACCEPTED_BASE_SHA: d8f57b5caa23f7bcbe134ddc5555cf6ad1fab7a1
          PATCH_SOURCE_SHA: 10e3cd9bf6519620ab9396eac05595bc44b36493
        run: |
          set -euo pipefail
          helper_branch="serviceos-release-hardening-runner"
          result_file=".github/serviceos-release-hardening.result"

          record_failure() {
            code=$?
            trap - ERR
            git reset --hard >/dev/null 2>&1 || true
            git checkout "$helper_branch" >/dev/null 2>&1 || true
            printf 'FAIL\nexit_code=%s\n' "$code" > "$result_file"
            git config user.name "serviceos-release-bot"
            git config user.email "68502405+jashive@users.noreply.github.com"
            git add -- "$result_file"
            git commit -m "Record ServiceOS hardening runner failure" >/dev/null 2>&1 || true
            git push origin HEAD:"$helper_branch" >/dev/null 2>&1 || true
            exit "$code"
          }
          trap record_failure ERR

          git fetch origin "$TARGET_BRANCH"
          actual_target="$(git rev-parse "origin/$TARGET_BRANCH")"
          test "$actual_target" = "$EXPECTED_TARGET_SHA"

          git show "$PATCH_SOURCE_SHA:.github/workflows/serviceos-release-hardening.yml" > /tmp/original-hardening.yml
          git checkout --detach "$ACCEPTED_BASE_SHA"

          python - <<'PY'
          from pathlib import Path
          workflow = Path('/tmp/original-hardening.yml').read_text().splitlines()
          start = next(i for i, line in enumerate(workflow) if "python - <<'PY'" in line) + 1
          end = next(i for i in range(start, len(workflow)) if workflow[i].strip() == 'PY')
          lines = workflow[start:end]
          normalized = [line[10:] if line.startswith('          ') else line for line in lines]
          Path('/tmp/serviceos_hardening_patch.py').write_text('\n'.join(normalized) + '\n')
          PY

          python /tmp/serviceos_hardening_patch.py

          python - <<'PY'
          from pathlib import Path
          p = Path('tests/serviceosWave4RlsHarness.test.mjs')
          text = p.read_text()
          old = '''test("W4H-14. Stripe webhook fails closed when SERVICEOS_ENVIRONMENT is missing/unknown (A8)", () => {
  assert.ok(
    stripeSrc.includes("SERVICEOS_ENVIRONMENT is not set") || stripeSrc.includes("not a recognized value"),
    "Stripe webhook must fail closed when SERVICEOS_ENVIRONMENT is missing/unknown"
  );
  assert.ok(
    stripeSrc.includes("503") || stripeSrc.includes("fail-closed") || stripeSrc.includes("FAIL CLOSED"),
    "Stripe webhook must return non-2xx for missing environment"
  );
});'''
          new = '''test("W4H-14. Stripe legacy path stays compatible while explicit Wave5 persistence fails closed on environment/target (A8)", () => {
  const handlerStart = stripeSrc.indexOf("export default async function handler");
  const wave5Check = stripeSrc.indexOf("isWave5InvoiceEvent(session)", handlerStart);
  const targetGuard = stripeSrc.indexOf("requireServiceosServerTarget(process.env)", handlerStart);
  assert.ok(
    handlerStart >= 0 && wave5Check > handlerStart && targetGuard > wave5Check,
    "Stripe must preserve legacy webhook parsing and apply the ServiceOS environment/project guard only after explicit Wave5 classification"
  );
  assert.ok(
    stripeSrc.includes("Wave5 canonical payment target validation failed") && stripeSrc.includes("SERVICEOS_SERVER_TARGET_INVALID"),
    "Explicit Wave5 canonical persistence must fail closed when ServiceOS environment/project validation fails"
  );
});'''
          if text.count(old) != 1:
              raise SystemExit(f'stale W4H-14 replacement target count was {text.count(old)}')
          p.write_text(text.replace(old, new, 1))
          PY

          git diff --check
          npm ci
          npm test
          npm run build

          git config user.name "serviceos-release-bot"
          git config user.email "68502405+jashive@users.noreply.github.com"
          git add -- .env.example api/stripe-webhook.js api/wave4-rls-acceptance-harness.js api/wave5-accounting-sync.js api/wave5-preview-payment.js src/server/serviceosServerEnvironment.js tests/serviceosWave5Finance.test.mjs tests/supabaseConfigSafety.test.mjs tests/serviceosWave4RlsHarness.test.mjs
          git diff --cached --check
          git commit -m "Harden ServiceOS production release boundaries"
          final_sha="$(git rev-parse HEAD)"
          git push --force-with-lease="refs/heads/$TARGET_BRANCH:$EXPECTED_TARGET_SHA" origin "HEAD:$TARGET_BRANCH"
          printf 'PASS\nfinal_sha=%s\n' "$final_sha"
