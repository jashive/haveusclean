name: ServiceOS Full Live OAT

on:
  push:
    branches:
      - serviceos-oat-runner
    paths:
      - .github/serviceos-oat-run.request

permissions:
  contents: read

jobs:
  full-live-oat:
    name: Full live operational acceptance
    runs-on: ubuntu-latest
    timeout-minutes: 45

    env:
      BASE_URL: https://haveusclean-k872t00xl-jasons-projects-54483428.vercel.app
      VERCEL_AUTOMATION_BYPASS_SECRET: ${{ secrets.VERCEL_AUTOMATION_BYPASS_SECRET }}

      SERVICEOS_OAT_OWNER_EMAIL: serviceos.owner.acceptance@example.com
      SERVICEOS_OAT_OWNER_PASSWORD: ${{ secrets.SERVICEOS_OAT_OWNER_PASSWORD }}

      SERVICEOS_OAT_OFFICE_EMAIL: serviceos.office.acceptance@example.com
      SERVICEOS_OAT_OFFICE_PASSWORD: ${{ secrets.SERVICEOS_OAT_OFFICE_PASSWORD }}

      SERVICEOS_OAT_WORKER_EMAIL: serviceos.worker.acceptance@example.com
      SERVICEOS_OAT_WORKER_PASSWORD: ${{ secrets.SERVICEOS_OAT_WORKER_PASSWORD }}

      SERVICEOS_OAT_QA_EMAIL: serviceos.qa.acceptance@example.com
      SERVICEOS_OAT_QA_PASSWORD: ${{ secrets.SERVICEOS_OAT_QA_PASSWORD }}

      SERVICEOS_OAT_IGNORE_HTTPS_ERRORS: "true"

    steps:
      - name: Checkout isolated OAT helper branch
        uses: actions/checkout@v4
        with:
          ref: serviceos-oat-runner
          fetch-depth: 0

      - name: Verify authoritative candidate and helper isolation
        shell: bash
        run: |
          set -euo pipefail
          EXPECTED_SHA="433d4f64f6d7ba34863a03b7421e92543dd28818"

          if ! git cat-file -e "$EXPECTED_SHA^{commit}"; then
            echo "BLOCKED: authoritative ServiceOS candidate is not present"
            exit 1
          fi

          if ! git merge-base --is-ancestor "$EXPECTED_SHA" HEAD; then
            echo "BLOCKED: helper branch is not descended from the authoritative candidate"
            exit 1
          fi

          mapfile -t changed < <(git diff --name-only "$EXPECTED_SHA"..HEAD)
          printf 'Helper-only changes:\n'
          printf '  %s\n' "${changed[@]}"

          for path in "${changed[@]}"; do
            case "$path" in
              .github/workflows/serviceos-hosted-oat.yml|.github/serviceos-oat-run.request|scripts/serviceos-full-live-oat.mjs|vercel.json)
                ;;
              *)
                echo "BLOCKED: non-OAT helper change detected: $path"
                exit 1
                ;;
            esac
          done

          if ! grep -q '"serviceos-oat-runner": false' vercel.json; then
            echo "BLOCKED: helper-branch Vercel auto-deployment suppression is missing"
            exit 1
          fi

          echo "Authoritative application candidate remains: $EXPECTED_SHA"

      - name: Verify OAT environment
        shell: bash
        run: |
          set -euo pipefail
          missing=0

          for name in \
            BASE_URL \
            VERCEL_AUTOMATION_BYPASS_SECRET \
            SERVICEOS_OAT_OWNER_EMAIL \
            SERVICEOS_OAT_OWNER_PASSWORD \
            SERVICEOS_OAT_OFFICE_EMAIL \
            SERVICEOS_OAT_OFFICE_PASSWORD \
            SERVICEOS_OAT_WORKER_EMAIL \
            SERVICEOS_OAT_WORKER_PASSWORD \
            SERVICEOS_OAT_QA_EMAIL \
            SERVICEOS_OAT_QA_PASSWORD \
            SERVICEOS_OAT_IGNORE_HTTPS_ERRORS
          do
            if [ -z "${!name}" ]; then
              echo "$name=MISSING"
              missing=1
            else
              echo "$name=SET"
            fi
          done

          exit "$missing"

      - name: Cheap protected Preview automation-bypass preflight
        shell: bash
        run: |
          set -euo pipefail
          headers="$RUNNER_TEMP/serviceos-bypass-headers.txt"
          body="$RUNNER_TEMP/serviceos-bypass-body.html"

          status="$(curl \
            --silent \
            --show-error \
            --output "$body" \
            --dump-header "$headers" \
            --write-out '%{http_code}' \
            --max-time 20 \
            --max-redirs 0 \
            --header "x-vercel-protection-bypass: $VERCEL_AUTOMATION_BYPASS_SECRET" \
            --header "x-vercel-set-bypass-cookie: true" \
            "$BASE_URL/")"

          echo "Automation-bypass protected Preview HTTP status: $status"

          if [ "$status" != "200" ]; then
            echo "BLOCKED: Vercel Protection Bypass for Automation did not authorize the exact PR #8 Preview"
            grep -iE '^(location|content-type|x-vercel-error):' "$headers" || true
            exit 1
          fi

          if grep -qiE 'vercel\.com/sso-api|_vercel_sso_nonce' "$headers" "$body"; then
            echo "BLOCKED: exact Preview still resolved to Vercel SSO after automation bypass"
            exit 1
          fi

          echo "PASS: automation bypass can reach the exact protected PR #8 Preview"

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm

      - name: Static verify native automation-bypass harness
        shell: bash
        run: |
          set -euo pipefail

          node --check scripts/serviceos-full-live-oat.mjs

          if grep -qE 'SERVICEOS_OAT_PREVIEW_ACCESS_URL|VERCEL_OIDC_TOKEN|x-vercel-trusted-oidc-idp-token|_vercel_share' scripts/serviceos-full-live-oat.mjs; then
            echo "BLOCKED: stale share-link or OIDC dependency remains in full OAT harness"
            exit 1
          fi

          if ! grep -q 'VERCEL_AUTOMATION_BYPASS_SECRET' scripts/serviceos-full-live-oat.mjs; then
            echo "BLOCKED: automation bypass secret is not required by full OAT harness"
            exit 1
          fi

          if ! grep -q 'url.hostname === EXPECTED_BASE_HOST' scripts/serviceos-full-live-oat.mjs; then
            echo "BLOCKED: exact-host route guard is missing"
            exit 1
          fi

          if ! grep -q 'x-vercel-protection-bypass' scripts/serviceos-full-live-oat.mjs; then
            echo "BLOCKED: Vercel automation bypass header injection is missing"
            exit 1
          fi

          if ! grep -q 'x-vercel-set-bypass-cookie' scripts/serviceos-full-live-oat.mjs; then
            echo "BLOCKED: Vercel bypass-cookie request is missing"
            exit 1
          fi

          if grep -q 'extraHTTPHeaders' scripts/serviceos-full-live-oat.mjs; then
            echo "BLOCKED: global browser headers are prohibited because they could leak the Vercel bypass secret"
            exit 1
          fi

          echo "PASS: native bypass harness is syntactically valid, share-link free, OIDC free, and exact-host scoped"

      - name: Install dependencies
        run: npm ci

      - name: Install Chromium
        run: npx playwright install --with-deps chromium

      - name: Run full live ServiceOS OAT
        run: node scripts/serviceos-full-live-oat.mjs
