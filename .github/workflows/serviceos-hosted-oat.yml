name: ServiceOS Local-Runner Full OAT

on:
  push:
    branches:
      - serviceos-oat-runner
    paths:
      - .github/serviceos-oat-run.request

permissions:
  contents: read

jobs:
  full-live-oat:
    name: Wave 1-6 local-runner acceptance
    runs-on: ubuntu-latest
    environment: acceptance
    timeout-minutes: 45

    env:
      EXPECTED_CANDIDATE_SHA: 03eacdf5917ed399e942764a8e001f2cd61b4f3e
      ACCEPTANCE_SUPABASE_URL: https://hqeamecwdsrjfjybrsox.supabase.co
      BASE_URL: http://localhost:3000
      SERVICEOS_OAT_OWNER_EMAIL: serviceos.owner.acceptance@example.com
      SERVICEOS_OAT_OFFICE_EMAIL: serviceos.office.acceptance@example.com
      SERVICEOS_OAT_WORKER_EMAIL: serviceos.worker.acceptance@example.com
      SERVICEOS_OAT_QA_EMAIL: serviceos.qa.acceptance@example.com
      SERVICEOS_OAT_IGNORE_HTTPS_ERRORS: "false"

    steps:
      - name: Checkout isolated OAT helper branch
        uses: actions/checkout@v4
        with:
          ref: serviceos-oat-runner
          fetch-depth: 0

      - name: Verify authoritative candidate and helper isolation
        shell: bash
        run: |
          set -euo pipefail

          if ! git cat-file -e "$EXPECTED_CANDIDATE_SHA^{commit}"; then
            echo "BLOCKED: authoritative ServiceOS candidate is not present"
            exit 1
          fi

          if ! git merge-base --is-ancestor "$EXPECTED_CANDIDATE_SHA" HEAD; then
            echo "BLOCKED: helper branch is not descended from the authoritative candidate"
            exit 1
          fi

          mapfile -t changed < <(git diff --name-only "$EXPECTED_CANDIDATE_SHA"..HEAD)
          printf 'Helper-only changes:\n'
          printf '  %s\n' "${changed[@]}"

          for path in "${changed[@]}"; do
            case "$path" in
              .github/workflows/serviceos-hosted-oat.yml|.github/serviceos-oat-run.request|scripts/serviceos-full-live-oat.mjs)
                ;;
              *)
                echo "BLOCKED: non-OAT helper change detected: $path"
                exit 1
                ;;
            esac
          done

          echo "Authoritative application candidate remains: $EXPECTED_CANDIDATE_SHA"

      - name: Verify Acceptance secrets are available
        shell: bash
        env:
          SERVICEOS_ACCEPTANCE_SUPABASE_ANON_KEY: ${{ secrets.SERVICEOS_ACCEPTANCE_SUPABASE_ANON_KEY }}
          SERVICEOS_ACCEPTANCE_SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SERVICEOS_ACCEPTANCE_SUPABASE_SERVICE_ROLE_KEY }}
          SERVICEOS_OAT_OWNER_PASSWORD: ${{ secrets.SERVICEOS_OAT_OWNER_PASSWORD }}
          SERVICEOS_OAT_OFFICE_PASSWORD: ${{ secrets.SERVICEOS_OAT_OFFICE_PASSWORD }}
          SERVICEOS_OAT_WORKER_PASSWORD: ${{ secrets.SERVICEOS_OAT_WORKER_PASSWORD }}
          SERVICEOS_OAT_QA_PASSWORD: ${{ secrets.SERVICEOS_OAT_QA_PASSWORD }}
        run: |
          set -euo pipefail
          missing=0
          for name in \
            SERVICEOS_ACCEPTANCE_SUPABASE_ANON_KEY \
            SERVICEOS_ACCEPTANCE_SUPABASE_SERVICE_ROLE_KEY \
            SERVICEOS_OAT_OWNER_PASSWORD \
            SERVICEOS_OAT_OFFICE_PASSWORD \
            SERVICEOS_OAT_WORKER_PASSWORD \
            SERVICEOS_OAT_QA_PASSWORD
          do
            if [ -z "${!name:-}" ]; then
              echo "$name=MISSING"
              missing=1
            else
              echo "$name=SET"
            fi
          done
          exit "$missing"

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run Wave 1-6 repository tests
        run: npm test

      - name: Verify approved Acceptance mutation target
        env:
          SUPABASE_URL: ${{ env.ACCEPTANCE_SUPABASE_URL }}
          SERVICEOS_ACCEPTANCE_MUTATIONS_APPROVED: "true"
        run: node scripts/serviceos-acceptance-preflight.mjs --mutation

      - name: Build local Acceptance application
        env:
          VITE_SUPABASE_URL: ${{ env.ACCEPTANCE_SUPABASE_URL }}
          VITE_SUPABASE_ANON_KEY: ${{ secrets.SERVICEOS_ACCEPTANCE_SUPABASE_ANON_KEY }}
          VITE_SERVICEOS_ENVIRONMENT: acceptance
        run: npm run build

      - name: Prepare full OAT harness for exact localhost origin
        shell: bash
        run: |
          set -euo pipefail
          node --input-type=module <<'NODE'
          import fs from 'node:fs';

          const path = 'scripts/serviceos-full-live-oat.mjs';
          let source = fs.readFileSync(path, 'utf8');
          const oldHost = 'haveusclean-k872t00xl-jasons-projects-54483428.vercel.app';
          const candidate = '03eacdf5917ed399e942764a8e001f2cd61b4f3e';

          source = source.replace(`const EXPECTED_BASE_HOST = "${oldHost}";`, 'const EXPECTED_BASE_HOST = "localhost";');
          source = source.replace('    "VERCEL_AUTOMATION_BYPASS_SECRET",\n', '');
          source = source.replace('assert(base.protocol === "https:", "BASE_URL must be HTTPS", "BLOCKER");', 'assert(base.protocol === "http:", "BASE_URL must be HTTP for the isolated local runner", "BLOCKER");');
          source = source.replace('"BASE_URL is not the exact authoritative Preview"', '"BASE_URL is not the exact isolated local runner"');
          source = source.replace('`protected Preview navigation escaped authoritative host: ${current.hostname}`', '`local runner navigation escaped localhost: ${current.hostname}`');
          source = source.replace('assert(url.hostname === EXPECTED_BASE_HOST, "Preview API request escaped authoritative host", "CRITICAL");', 'assert(url.hostname === EXPECTED_BASE_HOST, "Local API request escaped localhost", "CRITICAL");');
          source = source.replace('433d4f64f6d7ba34863a03b7421e92543dd28818', candidate);

          const routeStart = source.indexOf('  const bypassSecret = process.env.VERCEL_AUTOMATION_BYPASS_SECRET;');
          const routeEnd = source.indexOf('  const page = await context.newPage();', routeStart);
          if (routeStart < 0 || routeEnd < 0) throw new Error('expected Vercel route-injection block not found');
          source = source.slice(0, routeStart) + source.slice(routeEnd);
          source = source.replace(/\n\s*"x-vercel-protection-bypass": process\.env\.VERCEL_AUTOMATION_BYPASS_SECRET,/, '');

          fs.writeFileSync(path, source);
          NODE

          node --check scripts/serviceos-full-live-oat.mjs
          grep -q 'const EXPECTED_BASE_HOST = "localhost"' scripts/serviceos-full-live-oat.mjs
          grep -q 'candidateSha: "03eacdf5917ed399e942764a8e001f2cd61b4f3e"' scripts/serviceos-full-live-oat.mjs
          if grep -q 'context.route' scripts/serviceos-full-live-oat.mjs; then
            echo "BLOCKED: Vercel request-header injection remains in local OAT harness"
            exit 1
          fi
          echo "PASS: full OAT harness is pinned to localhost and current PR #8 candidate"

      - name: Install Chromium
        run: npx playwright install --with-deps chromium

      - name: Run full Wave 1-6 OAT against local app and real Acceptance DB
        shell: bash
        env:
          SUPABASE_URL: ${{ env.ACCEPTANCE_SUPABASE_URL }}
          SUPABASE_ANON_KEY: ${{ secrets.SERVICEOS_ACCEPTANCE_SUPABASE_ANON_KEY }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SERVICEOS_ACCEPTANCE_SUPABASE_SERVICE_ROLE_KEY }}
          SERVICEOS_ENVIRONMENT: test
          SERVICEOS_W5_PREVIEW_PAYMENT_ENABLED: "true"
          SERVICEOS_OAT_OWNER_PASSWORD: ${{ secrets.SERVICEOS_OAT_OWNER_PASSWORD }}
          SERVICEOS_OAT_OFFICE_PASSWORD: ${{ secrets.SERVICEOS_OAT_OFFICE_PASSWORD }}
          SERVICEOS_OAT_WORKER_PASSWORD: ${{ secrets.SERVICEOS_OAT_WORKER_PASSWORD }}
          SERVICEOS_OAT_QA_PASSWORD: ${{ secrets.SERVICEOS_OAT_QA_PASSWORD }}
        run: |
          set -euo pipefail

          server="$RUNNER_TEMP/serviceos-oat-local-server.mjs"
          log="$RUNNER_TEMP/serviceos-oat-local-server.log"

          cat > "$server" <<'NODE'
          import http from 'node:http';
          import fs from 'node:fs';
          import path from 'node:path';
          import { pathToFileURL } from 'node:url';

          const ACCEPTANCE_REF = 'hqeamecwdsrjfjybrsox';
          const PRODUCTION_REF = 'opazwghrohmfykzxxsjk';
          const expectedUrl = `https://${ACCEPTANCE_REF}.supabase.co`;
          if (process.env.SUPABASE_URL !== expectedUrl) throw new Error('local server is not pinned to approved Acceptance Supabase');
          if (process.env.SUPABASE_URL.includes(PRODUCTION_REF)) throw new Error('production Supabase target prohibited');
          if (!process.env.SUPABASE_ANON_KEY) throw new Error('SUPABASE_ANON_KEY missing');
          if (!process.env.SUPABASE_SERVICE_ROLE_KEY) throw new Error('SUPABASE_SERVICE_ROLE_KEY missing');
          if (process.env.SERVICEOS_ENVIRONMENT !== 'test') throw new Error('SERVICEOS_ENVIRONMENT must be test');
          if (process.env.SERVICEOS_W5_PREVIEW_PAYMENT_ENABLED !== 'true') throw new Error('Wave 5 preview payment must be explicitly enabled');

          const { default: paymentHandler } = await import(pathToFileURL(path.resolve('api/wave5-preview-payment.js')).href);
          const dist = path.resolve('dist');
          const types = new Map([
            ['.html', 'text/html; charset=utf-8'],
            ['.js', 'text/javascript; charset=utf-8'],
            ['.css', 'text/css; charset=utf-8'],
            ['.json', 'application/json; charset=utf-8'],
            ['.svg', 'image/svg+xml'],
            ['.png', 'image/png'],
            ['.jpg', 'image/jpeg'],
            ['.jpeg', 'image/jpeg'],
            ['.ico', 'image/x-icon'],
          ]);

          function sendJson(res, status, value) {
            res.writeHead(status, { 'content-type': 'application/json; charset=utf-8', 'cache-control': 'no-store' });
            res.end(JSON.stringify(value));
          }

          async function readBody(req) {
            let raw = '';
            for await (const chunk of req) raw += chunk;
            if (!raw) return {};
            return JSON.parse(raw);
          }

          function serveFile(res, file) {
            const ext = path.extname(file).toLowerCase();
            res.writeHead(200, { 'content-type': types.get(ext) || 'application/octet-stream', 'cache-control': 'no-store' });
            fs.createReadStream(file).pipe(res);
          }

          const server = http.createServer(async (req, res) => {
            try {
              const url = new URL(req.url || '/', 'http://localhost:3000');

              if (url.pathname === '/__oat/health') {
                return sendJson(res, 200, { status: 'PASS', projectRef: ACCEPTANCE_REF, environment: 'test' });
              }

              if (url.pathname === '/api/wave5-preview-payment') {
                let body;
                try { body = await readBody(req); }
                catch { return sendJson(res, 400, { success: false, error: 'Request body must be valid JSON' }); }

                let statusCode = 200;
                let sent = false;
                const response = {
                  status(code) { statusCode = code; return this; },
                  json(payload) {
                    if (sent) return this;
                    sent = true;
                    sendJson(res, statusCode, payload);
                    return this;
                  },
                };
                await paymentHandler({ method: req.method, headers: req.headers, body }, response);
                if (!sent) sendJson(res, 500, { success: false, error: 'Local API handler returned without a response' });
                return;
              }

              const requested = url.pathname === '/' ? 'index.html' : decodeURIComponent(url.pathname.slice(1));
              let file = path.resolve(dist, requested);
              if (!file.startsWith(dist + path.sep) && file !== path.join(dist, 'index.html')) {
                return sendJson(res, 403, { error: 'Forbidden' });
              }
              if (!fs.existsSync(file) || !fs.statSync(file).isFile()) file = path.join(dist, 'index.html');
              serveFile(res, file);
            } catch (error) {
              console.error('local-server-error', error?.message || error);
              if (!res.headersSent) sendJson(res, 500, { error: 'Local OAT server failure' });
              else res.end();
            }
          });

          server.listen(3000, '0.0.0.0', () => {
            console.log('ServiceOS local OAT server listening on http://localhost:3000');
          });
          NODE

          node "$server" > "$log" 2>&1 &
          server_pid=$!
          trap 'kill "$server_pid" 2>/dev/null || true' EXIT

          ready=0
          for attempt in $(seq 1 30); do
            if curl --silent --fail http://localhost:3000/__oat/health > "$RUNNER_TEMP/serviceos-local-health.json"; then
              ready=1
              break
            fi
            sleep 1
          done

          if [ "$ready" -ne 1 ]; then
            echo "BLOCKED: local ServiceOS server did not become healthy"
            cat "$log" || true
            exit 1
          fi

          cat "$RUNNER_TEMP/serviceos-local-health.json"
          node scripts/serviceos-full-live-oat.mjs

      - name: Reconfirm PR candidate was not modified by helper OAT
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          git reset --hard HEAD >/dev/null
          if ! git merge-base --is-ancestor "$EXPECTED_CANDIDATE_SHA" HEAD; then
            echo "BLOCKED: helper provenance changed during OAT"
            exit 1
          fi
          echo "PASS: PR #8 candidate remained unchanged by local-runner OAT"
