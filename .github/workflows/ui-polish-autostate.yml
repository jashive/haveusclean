name: Harden dispatch END auto-state

on:
  push:
    branches:
      - feature/dispatch-revenue-ui-polish
    paths:
      - .github/workflows/ui-polish-autostate.yml

permissions:
  contents: write

jobs:
  harden:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/dispatch-revenue-ui-polish
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Track END auto-calculation state
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path('src/features/wave3/ServiceOSOperationsWorkspace.jsx')
          text = p.read_text()
          def rep(old,new):
              global text
              if old not in text:
                  raise SystemExit(f'anchor not found: {old[:90]!r}')
              text = text.replace(old,new,1)
          rep('  const [end, setEnd] = useState("");\n  const [timezone, setTimezone]', '  const [end, setEnd] = useState("");\n  const [endAutoCalculated, setEndAutoCalculated] = useState(false);\n  const [timezone, setTimezone]')
          rep('    if (!handoff) { setStart(""); setEnd(""); setScheduleHint(""); return; }', '    if (!handoff) { setStart(""); setEnd(""); setEndAutoCalculated(false); setScheduleHint(""); return; }')
          rep('      setEnd(duration ? addHoursToLocalDateTime(requested, duration) : "");\n      setScheduleHint(duration', '      setEnd(duration ? addHoursToLocalDateTime(requested, duration) : "");\n      setEndAutoCalculated(Boolean(duration));\n      setScheduleHint(duration')
          rep('      setStart(""); setEnd("");\n      setScheduleHint(requested', '      setStart(""); setEnd(""); setEndAutoCalculated(false);\n      setScheduleHint(requested')
          rep('onChange={e=>setEnd(e.target.value)} /></label>', 'onChange={e=>{setEnd(e.target.value);setEndAutoCalculated(false);}} /></label>')
          rep('selectedHandoff.estimated_duration_hours && end ? <span style={{...styles.laborBadge,...styles.badgeReady}}>End auto-calculated</span> : null', 'endAutoCalculated && end ? <span style={{...styles.laborBadge,...styles.badgeReady}}>End auto-calculated</span> : null')
          rep('setHandoffId(""); setStart(""); setEnd(""); setScheduleHint("");', 'setHandoffId(""); setStart(""); setEnd(""); setEndAutoCalculated(false); setScheduleHint("");')
          p.write_text(text)

          t = Path('tests/serviceosCanonicalJobDuration.test.mjs')
          s = t.read_text()
          marker = '  assert.match(operations, /End auto-calculated/);'
          replacement = marker + '\n  assert.match(operations, /endAutoCalculated && end/);\n  assert.match(operations, /setEndAutoCalculated\\(false\\)/);'
          if marker not in s:
              raise SystemExit('test marker missing')
          t.write_text(s.replace(marker,replacement,1))
          PY
      - name: Targeted tests
        run: node --test tests/serviceosCanonicalJobDuration.test.mjs tests/serviceosWave3ProductionBoundary.test.mjs
      - name: Full suite
        run: npm test
      - name: Build
        run: npm run build
      - name: Commit hardening
        run: |
          rm .github/workflows/ui-polish-autostate.yml
          git config user.name "jashive"
          git config user.email "68502405+jashive@users.noreply.github.com"
          git add src/features/wave3/ServiceOSOperationsWorkspace.jsx tests/serviceosCanonicalJobDuration.test.mjs .github/workflows/ui-polish-autostate.yml
          git commit -m "Harden dispatch END auto-calculation indicator"
          git push origin HEAD:feature/dispatch-revenue-ui-polish
