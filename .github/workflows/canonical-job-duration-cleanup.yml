name: Clean canonical job duration branch

on:
  push:
    branches:
      - feature/canonical-job-duration
    paths:
      - .github/workflows/canonical-job-duration-cleanup.yml

permissions:
  contents: write

jobs:
  clean:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/canonical-job-duration
          fetch-depth: 0
      - name: Restore generated artifacts to main
        run: |
          git fetch origin main
          git checkout origin/main -- dist node_modules
          rm .github/workflows/canonical-job-duration-cleanup.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "chore: remove generated artifacts from canonical duration PR"
          git push origin HEAD:feature/canonical-job-duration
