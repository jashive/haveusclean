name: Clean canonical duration build artifacts

on:
  push:
    branches:
      - feature/canonical-job-duration
    paths:
      - .github/workflows/canonical-job-duration-cleanup-dist.yml

permissions:
  contents: write

jobs:
  clean:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/canonical-job-duration
          fetch-depth: 0
      - name: Remove branch-only build output
        run: |
          git fetch origin main
          git rm -r --ignore-unmatch dist
          git checkout origin/main -- dist 2>/dev/null || true
          rm .github/workflows/canonical-job-duration-cleanup-dist.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "chore: keep generated build output out of canonical duration PR"
          git push origin HEAD:feature/canonical-job-duration
